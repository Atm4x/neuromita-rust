name: Agent D37 exact onboarding commit import and Windows verification
on:
  push:
    branches:
      - codex/bridge-agent-d37-import-20261108
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce original D37 commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=970845a4dee2bedb6318733dc1f9bc832db25974
          HEAD=5d54ca4aa8431e92bbc255f0146ff73016730d53
          TREE=29998b7be9b914edac7ebca38a20d742b2de206b
          BRANCH=codex/onboarding-resumable-guide-20261108
          cat .git-bridge/d37.0{0..4} > /tmp/d37.patch.xz.b64
          test "$(wc -c </tmp/d37.patch.xz.b64)" -eq 8920
          base64 -d /tmp/d37.patch.xz.b64 > /tmp/d37.patch.xz
          echo '73c915af6506ea34c0017e3100d18c969ffd14afd8a141a244d097f30c273e35  /tmp/d37.patch.xz' | sha256sum --check
          xz -d --stdout /tmp/d37.patch.xz > /tmp/d37.patch
          git fetch --no-tags origin refs/heads/codex/python-schema-composite-activation-20261108
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test -z "$(git ls-remote --heads origin "refs/heads/$BRANCH")"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d37.patch
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" -eq 1
          git diff --check "$BASE" "$HEAD"
          git fsck --full
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD"
  windows-native:
    needs: import
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/onboarding-resumable-guide-20261108
          fetch-depth: 0
      - name: Pin onboarding source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5d54ca4aa8431e92bbc255f0146ff73016730d53
          test "$(git rev-parse HEAD^{tree})" = 29998b7be9b914edac7ebca38a20d742b2de206b
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Native onboarding restart, persistence and baseline
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --offline --lib onboarding::tests -- --test-threads=2
          cargo test --locked --offline --lib presentation::settings::tests -- --test-threads=2
          cargo test --locked --offline --test onboarding_consent -- --test-threads=2
          cargo check --locked --offline --all-targets
