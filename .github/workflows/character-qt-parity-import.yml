name: Import character Qt to Slint parity patch
on:
  push:
    branches:
      - codex/character-settings-qt-parity-20261103
    paths:
      - .github/bridge/character-qt-parity.patch.gz.b64
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and publish verified Qt parity patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/bridge/character-qt-parity.patch.gz.b64 | gzip -dc > /tmp/character-qt-parity.patch
          echo "660460100fef7d96cdd56bd5d1fcaf1a7c70af7f7ce6157eb7eaf6982f88a68b  /tmp/character-qt-parity.patch" | sha256sum -c -
          git apply --check /tmp/character-qt-parity.patch
          git apply /tmp/character-qt-parity.patch
          rm .github/bridge/character-qt-parity.patch.gz.b64
          rm .github/workflows/character-qt-parity-import.yml
          rm .github/workflows/character-qt-parity-export.yml
          git config user.name "Atm4x"
          git config user.email "96025052+Atm4x@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(slint): restore Qt character accordion and unified generation preset selection"
          git push origin HEAD:refs/heads/codex/character-settings-qt-parity-20261103
