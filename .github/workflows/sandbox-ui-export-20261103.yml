name: Sandbox UI source Git bundle
on:
  push:
    branches:
      - bridge/sandbox-ui-export-20261103
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and bundle target
        shell: bash
        env:
          TARGET_SHA: 9011649cf6b46e66712e2ef6fc2b2fff53f37917
          TARGET_REF: codex/sandbox-presenter-20261103
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$TARGET_REF:refs/remotes/origin/$TARGET_REF"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_REF")" = "$TARGET_SHA"
          git branch export/source "$TARGET_SHA"
          git bundle create sandbox-rust.bundle refs/heads/export/source
          git bundle verify sandbox-rust.bundle
          git bundle list-heads sandbox-rust.bundle
          sha256sum sandbox-rust.bundle > sandbox-rust.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-rust-source-20261103
          path: |
            sandbox-rust.bundle
            sandbox-rust.bundle.sha256
          retention-days: 7
