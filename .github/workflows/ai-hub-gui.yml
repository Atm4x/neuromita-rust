name: AI Hub GUI integration verification

on:
  push:
    branches:
      - codex/aihub-ui-integration-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-gui:
    name: offline Rust GUI QA
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             pkg-config libasound2-dev libudev-dev libxkbcommon-dev             libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev             libfontconfig1-dev libfreetype6-dev libssl-dev             libx11-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version
          rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: GUI typecheck
        run: cargo check --locked --offline --features gui --bin neuromita-gui
      - name: Core tests
        run: cargo test --locked --offline
      - name: GUI tests
        run: cargo test --locked --offline --features gui --bin neuromita-gui
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
