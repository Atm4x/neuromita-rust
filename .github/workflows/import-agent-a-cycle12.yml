name: Import Agent A Cycle12 Historical Recall Freshness
on:
  push:
    branches:
      - bridge/import-agent-a-cycle12-20261107
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact Git bundle and publish independent Agent A feature branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=71a9bc948cb5ad889363bbffa93d2d0954589950
          TARGET=0b049901e6b7d82b866bacca0bcd8790bda55c69
          BRANCH=codex/knowledge-authorized-recall-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-cycle12-recall-freshness.bundle.sha256
          git bundle verify .bridge/agent-a-cycle12-recall-freshness.bundle
          git fetch --no-tags .bridge/agent-a-cycle12-recall-freshness.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
