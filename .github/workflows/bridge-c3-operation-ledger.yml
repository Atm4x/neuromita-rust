name: Bridge exact C3 production operation journal commit
on:
  push:
    branches: [bridge/c4-install-operation-ledger-20261108]
    paths: [.github/workflows/bridge-c3-operation-ledger.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-install-operation-ledger-20261108
          fetch-depth: 0
      - name: Verify and fast-forward exact production journal change
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/c3-ledger.bundle.xz
          test "$(sha256sum /tmp/c3-ledger.bundle.xz | cut -d' ' -f1)" = 'b39e07ed8c2a60a15eadb8df7ab096eedd44fa6ca532da3adb63c62700225313'
          xz -d -c /tmp/c3-ledger.bundle.xz > /tmp/c3-ledger.bundle
          test "$(sha256sum /tmp/c3-ledger.bundle | cut -d' ' -f1)" = 'e923c389629d13b0da31d29b329a297d93cbe7a9820b42b0f90d301b637305e4'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-production-preflight-20261108
          test "$(git rev-parse FETCH_HEAD)" = '4dd039e5715cba45406d69cfceeede6d3237b8da'
          git fetch origin refs/heads/codex/ai-platform-hub-c3-durable-operation-ledger-20261108:refs/remotes/origin/candidate
          test "$(git rev-parse refs/remotes/origin/candidate)" = '4dd039e5715cba45406d69cfceeede6d3237b8da'
          git bundle verify /tmp/c3-ledger.bundle
          git fetch /tmp/c3-ledger.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '403c63a05eba0c6914dd6bd2adf2dc3555a35acc'
          git checkout --detach '403c63a05eba0c6914dd6bd2adf2dc3555a35acc'
          test "$(git rev-parse HEAD^{tree})" = 'c02411bf5e43e471bede7e233e789bcdda14fdad'
          git merge-base --is-ancestor '4dd039e5715cba45406d69cfceeede6d3237b8da' HEAD
          git diff --check '4dd039e5715cba45406d69cfceeede6d3237b8da' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c3-durable-operation-ledger-20261108
