name: Bridge C4 typed speech presenter and readiness
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-readiness.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Verify exact incremental Git bundle and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/c4-readiness.bundle
          test "$(sha256sum /tmp/c4-readiness.bundle | cut -d' ' -f1)" = "e7d9ff2145c530b5f64654b118795008638a828028c28fcbd41cd6fae5551953"
          git fetch origin refs/heads/codex/ai-platform-hub-c4-readonly-inventory-presenter-20261108
          test "$(git rev-parse FETCH_HEAD)" = "7df9417eb5bec363dc984dd62c4014c9c238be3f"
          git fetch origin refs/heads/codex/ai-platform-hub-c4-tested-projection-warning-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = "7df9417eb5bec363dc984dd62c4014c9c238be3f"
          git bundle verify /tmp/c4-readiness.bundle
          git fetch /tmp/c4-readiness.bundle refs/heads/codex/ai-platform-hub-c4-tested-projection-warning-20261108
          test "$(git rev-parse FETCH_HEAD)" = "d75e2a4690e19a7bf3aeafb026b528f2dda0c65d"
          git checkout --detach "d75e2a4690e19a7bf3aeafb026b528f2dda0c65d"
          test "$(git rev-parse 'HEAD^{tree}')" = "e37b0f5af35d1113b5019e43d95fb09aa65ce0e7"
          git merge-base --is-ancestor "7df9417eb5bec363dc984dd62c4014c9c238be3f" HEAD
          git diff --check "7df9417eb5bec363dc984dd62c4014c9c238be3f" HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-tested-projection-warning-20261108
