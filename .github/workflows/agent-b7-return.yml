name: Publish Agent B7 verified Git bundle
on:
  push:
    branches:
      - bridge/agent-b7-return-20261107
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39ea0870cd28252059c1825ad5e7bd4ea27804c0
          fetch-depth: 0
      - name: Verify and publish B7 fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=39ea0870cd28252059c1825ad5e7bd4ea27804c0
          EXPECTED=becfac150323bd32fbe5236a4b295dacd8a21156
          SHA256=110f4aefed23eb4387b7d264a2a57f81da92bbfb09c412d7e76c720ed44165fd
          TARGET=refs/heads/codex/timeline-multimodal-failclosed-20261107
          git fetch origin refs/heads/bridge/agent-b7-return-20261107
          git show FETCH_HEAD:.bridge/agent-b7-20261107.bundle.b64 | base64 --decode > /tmp/agent-b7.bundle
          echo "$SHA256  /tmp/agent-b7.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/agent-b7.bundle
          git fetch /tmp/agent-b7.bundle HEAD
          IMPORTED="$(git rev-parse FETCH_HEAD)"
          test "$IMPORTED" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$IMPORTED"
          REMOTE="$(git ls-remote origin "$TARGET" | cut -f1)"
          if [[ -n "$REMOTE" && "$REMOTE" != "$EXPECTED" ]]; then
            echo "Destination exists at unexpected SHA: $REMOTE" >&2
            exit 1
          fi
          git update-ref "$TARGET" "$IMPORTED"
          if [[ "$REMOTE" != "$EXPECTED" ]]; then
            git push origin "$TARGET:$TARGET"
          fi
          echo "Published $TARGET @ $IMPORTED"
