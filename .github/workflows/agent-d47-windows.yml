name: Agent D47 native Windows activation checks
on:
  push:
    branches:
      - bridge/agent-d47-windows-ci-20261109
permissions:
  contents: read
jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Check native GUI notice boundary
        run: cargo check --locked --offline --features gui --bin neuromita-gui
      - name: Check all project targets
        run: cargo check --locked --offline --all-targets
      - name: Native update activation unit tests
        run: cargo test --locked --offline --lib updater:: -- --test-threads=2
      - name: Rust formatting
        run: cargo fmt --all -- --check
