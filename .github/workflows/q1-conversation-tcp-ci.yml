name: Conversation TCP Acceptance (Q1)

on:
  pull_request:
    paths:
      - 'tests/local_control.rs'
      - '.github/workflows/q1-conversation-tcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-conversation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: TCP conversation acceptance
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: cargo test --locked --offline --test local_control
