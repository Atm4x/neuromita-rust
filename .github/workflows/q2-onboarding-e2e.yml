name: Q2 onboarding real AppWindow EULA Wiki scroll screenshots
on:
  pull_request:
    branches: [main]
    paths:
      - "src/onboarding/**"
      - "src/bin/neuromita-gui/wiki.rs"
      - "src/bin/neuromita-gui/binding.rs"
      - "ui/pages/wiki.slint"
      - "examples/q2_onboarding_acceptance.rs"
      - ".github/workflows/q2-onboarding-*.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  q2-gui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1 and Slint OS dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcb1-dev xvfb mesa-utils
      - name: Rustfmt and full AppWindow interactive scroll fixture
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 build --locked --features gui --example q2_onboarding_acceptance
          mkdir -p q2-evidence
          xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/examples/q2_onboarding_acceptance q2-evidence
      - name: Re-run packaged Guide/Wiki from unrelated working directory
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/q2-altcwd"
          (
            cd "$RUNNER_TEMP"
            xvfb-run -a -s "-screen 0 1600x1000x24" "$GITHUB_WORKSPACE/target/debug/examples/q2_onboarding_acceptance" "$RUNNER_TEMP/q2-altcwd"
          )
          test -s "$RUNNER_TEMP/q2-altcwd/guide-image-focus-zoom.ppm"
          cp "$RUNNER_TEMP/q2-altcwd/guide-image-focus-zoom.ppm" q2-evidence/guide-focus-altcwd.ppm
          cp "$RUNNER_TEMP/q2-altcwd/wiki-home-ru.ppm" q2-evidence/wiki-home-altcwd.ppm
      - name: Verify Guide page ACK ordering and failure isolation
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" cargo +1.98.1 test --locked --features gui --bin neuromita-gui guide_navigation_ack -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-onboarding-appwindow-screenshots
          path: q2-evidence/
          retention-days: 3
          if-no-files-found: warn
