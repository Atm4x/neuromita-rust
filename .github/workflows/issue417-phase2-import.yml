name: Issue417 common InstallationOwner verified import and GUI
on:
  push:
    branches:
      - bridge/issue417-phase2-import-20261111
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact local commit and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f transfer/issue417-phase2.b64 ]; then exit 0; fi
          git fetch origin +refs/heads/codex/issue417-module-bootstrap-20261111:refs/heads/issue417-base
          test "$(git rev-parse refs/heads/issue417-base)" = "1994c5650d123c944f0fd62ce3985486fbd56a07"
          base64 -d transfer/issue417-phase2.b64 > "$RUNNER_TEMP/issue417-phase2.bundle"
          echo "f8d96848c49cb12ddd831d22891593c564f50750f5dc8240d7a950ccacfc8771  $RUNNER_TEMP/issue417-phase2.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/issue417-phase2.bundle"
          git fetch "$RUNNER_TEMP/issue417-phase2.bundle" refs/heads/issue417-base:refs/heads/issue417-candidate
          test "$(git rev-parse refs/heads/issue417-candidate)" = "9a4384cad6319d160fcf8f06ea7b2b1eab2ff95b"
          git merge-base --is-ancestor "1994c5650d123c944f0fd62ce3985486fbd56a07" refs/heads/issue417-candidate
          git push origin refs/heads/issue417-candidate:refs/heads/codex/issue417-module-bootstrap-20261111
  gui-check:
    if: github.event.head_commit.message == 'bridge-install-ready'
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a4384cad6319d160fcf8f06ea7b2b1eab2ff95b
          fetch-depth: 1
      - name: Install Linux audio and Slint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Compile GUI and presenter
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo check --features gui --bin neuromita-gui --offline -j1
