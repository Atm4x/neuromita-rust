name: Export Rust main source for character parity
on:
  push:
    branches:
      - codex/character-settings-memory-parity-20261103
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export verified main history
        shell: bash
        run: |
          set -euo pipefail
          git branch rust-export "$GITHUB_SHA"
          git bundle create rust-parity.bundle refs/heads/rust-export
          git bundle verify rust-parity.bundle
          sha256sum rust-parity.bundle > rust-parity.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: neuromita-rust-character-parity-bundle
          path: |
            rust-parity.bundle
            rust-parity.bundle.sha256
          retention-days: 7
