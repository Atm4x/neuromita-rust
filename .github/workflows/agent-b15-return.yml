name: Publish Agent B15 verified Git bundle
on:
  push:
    branches:
      - bridge/agent-b15-return-20261107
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3df58f720eee864f261c47665fcb6a509ab43efe
          fetch-depth: 0
      - name: Import B15 incremental bundle with checksum and commit identity verification
        shell: bash
        run: |
          set -euo pipefail
          BASE=3df58f720eee864f261c47665fcb6a509ab43efe
          EXPECTED=7d5202d6542350dfb2a1a046846e045fb1dec380
          SHA256=9aa7d80cbaa58706a7725bfc6391ad5a15fcc400c2cac7a21197707f431848f9
          TARGET=refs/heads/codex/timeline-asset-orphan-inventory-20261107
          git fetch origin refs/heads/bridge/agent-b15-return-20261107
          git show FETCH_HEAD:.bridge/agent-b15-20261107.bundle.b64 | base64 --decode > /tmp/agent-b15.bundle
          echo "$SHA256  /tmp/agent-b15.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/agent-b15.bundle
          git fetch /tmp/agent-b15.bundle HEAD
          IMPORTED="$(git rev-parse FETCH_HEAD)"
          test "$IMPORTED" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$IMPORTED"
          REMOTE="$(git ls-remote origin "$TARGET" | cut -f1)"
          if [[ -n "$REMOTE" && "$REMOTE" != "$EXPECTED" ]]; then
            echo "Unexpected destination head: $REMOTE" >&2
            exit 1
          fi
          git update-ref "$TARGET" "$IMPORTED"
          if [[ "$REMOTE" != "$EXPECTED" ]]; then
            git push origin "$TARGET:$TARGET"
          fi
          echo "Published $TARGET @ $IMPORTED"
