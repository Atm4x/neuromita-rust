name: Bridge C4 single wheel Core GUI operation
on:
  push:
    branches: [bridge/c4-single-wheel-20261108]
    paths: [.github/workflows/bridge-c4-single-wheel-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-wheel-20261108
          fetch-depth: 0
      - name: Import verified exact C4 incremental Git bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-single-wheel.bundle
          test "$(sha256sum /tmp/c4-single-wheel.bundle | cut -d' ' -f1)" = '2dea7e43bd2c43c8d9cca82ce9aa6a9d4d7a9f6c4b3fa199f8f2076d2e6a56a7'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-reviewed-wheel-admission-20261108
          test "$(git rev-parse FETCH_HEAD)" = '723b3439147a0bfb1453fce1d9579b0df97e76aa'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-single-wheel-operation-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = '723b3439147a0bfb1453fce1d9579b0df97e76aa'
          git bundle verify /tmp/c4-single-wheel.bundle
          git fetch /tmp/c4-single-wheel.bundle refs/heads/c4-single-wheel-transport
          test "$(git rev-parse FETCH_HEAD)" = '667f3fe52708a91623fef1bb73696232509876a4'
          git checkout --detach '667f3fe52708a91623fef1bb73696232509876a4'
          test "$(git rev-parse 'HEAD^{tree}')" = 'eb1ade771402f1cec9bff3987a02640c366df515'
          git merge-base --is-ancestor '723b3439147a0bfb1453fce1d9579b0df97e76aa' HEAD
          git diff --check '723b3439147a0bfb1453fce1d9579b0df97e76aa' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-single-wheel-operation-20261108
