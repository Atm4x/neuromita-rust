name: Agent D55 exact orphan handoff source import
on:
  push:
    branches:
      - bridge/agent-d55-orphan-handoff-20261109
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish exact D55 recovery source
        shell: bash
        run: |
          set -euo pipefail
          BASE=8b91fb8b36c7755714cc0aa6975e09e2fa5f8850
          EXPECTED=2791700dbbedda574a8fb587e128701980565b85
          TREE=a3610234d623aad11dc455de5d455eb3fb5bf5ce
          cat .agent-bridge/d55-part-0{1,2,3,4,5}.b64 | tr -d '\n' | base64 -d > /tmp/d55.patch.br
          echo '258f02a57d2f5736b6019012399e9e181890df73ba06f08e1092d60aebd2f8fd  /tmp/d55.patch.br' | sha256sum --check
          node -e "const fs=require('node:fs');const z=require('node:zlib');fs.writeFileSync('/tmp/d55.patch',z.brotliDecompressSync(fs.readFileSync('/tmp/d55.patch.br')))"
          echo '9f4741175b0ec8fa8a76e1064f586251b8de3198a287cae7b61ccbc249cd9d64  /tmp/d55.patch' | sha256sum --check
          git fetch origin "$BASE"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d55.patch
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          git diff --check HEAD^ HEAD
          git fsck --full
          git push origin HEAD:refs/heads/codex/agent-d55-orphan-handoff-recovery-20261109
