name: Import Agent A Memory Git Bundle
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish Agent A memory settings wiring
        shell: bash
        run: |
          set -euo pipefail
          BASE=0e804d161700be0d17673864333f319e51d860f8
          TARGET=ed490d65b3556a360807131b426a0c963da4292b
          BRANCH=codex/knowledge-memory-settings-wiring-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-memory-settings-wiring.bundle.sha256
          git bundle verify .bridge/agent-a-memory-settings-wiring.bundle
          git fetch --no-tags .bridge/agent-a-memory-settings-wiring.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
