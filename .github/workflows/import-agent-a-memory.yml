name: Import Agent A Model Memory Dedup Policy
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish Agent A scoped model memory policy
        shell: bash
        run: |
          set -euo pipefail
          BASE=ce35826f6bc0b8925973946a4271b8d66c6cdf29
          TARGET=4b6a58884c7c63d481fd8fc2b7e31fcfc1db86fb
          BRANCH=codex/knowledge-model-memory-dedup-policy-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-model-memory-policy.bundle.sha256
          git bundle verify .bridge/agent-a-model-memory-policy.bundle
          git fetch --no-tags .bridge/agent-a-model-memory-policy.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Branch exists; refuse overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
