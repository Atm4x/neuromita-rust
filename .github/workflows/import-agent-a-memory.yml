name: Import Agent A Model Memory Dedup Policy
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and fast-forward Agent A model memory PR
        shell: bash
        run: |
          set -euo pipefail
          BASE=4b6a58884c7c63d481fd8fc2b7e31fcfc1db86fb
          TARGET=0e804d161700be0d17673864333f319e51d860f8
          BRANCH=codex/knowledge-model-memory-dedup-policy-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-model-memory-policy-preflight.bundle.sha256
          git bundle verify .bridge/agent-a-model-memory-policy-preflight.bundle
          git fetch --no-tags .bridge/agent-a-model-memory-policy-preflight.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          CURRENT="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$CURRENT" = "$BASE"
          git push origin "$TARGET:refs/heads/$BRANCH"
