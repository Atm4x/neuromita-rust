name: Import Agent A Memory Git Bundle
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish RAG atomic-cache commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=4202f085de50d1b79653311df3df08c0d2568d2d
          TARGET=f3db01349f2d6ed273d4d96d457e549b9544d0e5
          BRANCH=codex/knowledge-rag-atomic-20261106
          git cat-file -e "$BASE^{commit}"
          git bundle verify .bridge/agent-a-rag-atomic.bundle
          git fetch --no-tags .bridge/agent-a-rag-atomic.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch already exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
