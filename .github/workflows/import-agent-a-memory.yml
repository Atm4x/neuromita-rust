name: Import Agent A Memory Git Bundle
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and fast-forward original Agent A branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=c2f526c66df196ee2e957498581ebac19b461070
          TARGET=c6776962859cda922b33421de39529c6eb2e9be1
          BRANCH=codex/knowledge-inline-structured-20261106
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-inline-clippy-followup.bundle.sha256
          git bundle verify .bridge/agent-a-inline-clippy-followup.bundle
          git fetch --no-tags .bridge/agent-a-inline-clippy-followup.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          CURRENT="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$CURRENT" = "$BASE"
          git push origin "$TARGET:refs/heads/$BRANCH"
