name: Import Agent A Memory Corruption Tests
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish Agent A memory corruption tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=1f33da245967ff075fd6a0b5813c4b1aa07ffd26
          TARGET=ce35826f6bc0b8925973946a4271b8d66c6cdf29
          BRANCH=codex/knowledge-memory-corruption-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-memory-corrupt-recovery.bundle.sha256
          git bundle verify .bridge/agent-a-memory-corrupt-recovery.bundle
          git fetch --no-tags .bridge/agent-a-memory-corrupt-recovery.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
