name: Import Agent A Memory Fork Follow-up
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and fast-forward Agent A memory PR
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b941ef8c74452c40ed7b807c1ead2146eefb703
          TARGET=1f33da245967ff075fd6a0b5813c4b1aa07ffd26
          BRANCH=codex/knowledge-memory-reset-epoch-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-memory-fork-followup.bundle.sha256
          git bundle verify .bridge/agent-a-memory-fork-followup.bundle
          git fetch --no-tags .bridge/agent-a-memory-fork-followup.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          CURRENT="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$CURRENT" = "$BASE"
          git push origin "$TARGET:refs/heads/$BRANCH"
