name: Import Agent A Memory Reset Epoch Git Bundle
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish independent Agent A memory reset commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=1f9b6059c61bf6a0349cb27b5b020122e89f31bc
          TARGET=9b941ef8c74452c40ed7b807c1ead2146eefb703
          BRANCH=codex/knowledge-memory-reset-epoch-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-memory-reset-epoch.bundle.sha256
          git bundle verify .bridge/agent-a-memory-reset-epoch.bundle
          git fetch --no-tags .bridge/agent-a-memory-reset-epoch.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
