name: Import Agent A Memory Git Bundle
on:
  push:
    branches:
      - bridge/import-agent-a-memory-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish Agent A graph fusion commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=c6776962859cda922b33421de39529c6eb2e9be1
          TARGET=1f9b6059c61bf6a0349cb27b5b020122e89f31bc
          BRANCH=codex/knowledge-graph-fusion-20261106
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-graph-fusion.bundle.sha256
          git bundle verify .bridge/agent-a-graph-fusion.bundle
          git fetch --no-tags .bridge/agent-a-graph-fusion.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Target branch exists; refusing overwrite."
            exit 1
          fi
          git push origin "$TARGET:refs/heads/$BRANCH"
