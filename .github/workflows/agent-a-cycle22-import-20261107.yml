name: Agent A cycle22 verified Slint graph maintenance import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle22-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original Agent A Git objects and fast-forward
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: f3e66b601f58fb3a918a19dbfd228be5fd900cb1
          BUNDLE_SHA256: b788386a8ada37e0bfc120f4f9033c87247ff72f6f318c74ec786348887ab1c5
          START_SHA: 1bb3af00982fd08828d71b60d3e4a6395a498d55
          HEAD_SHA: 57c8574f59a8141e2e1c1eaa02acbb1ab8e25ba0
          FEATURE_REF: codex/knowledge-graph-slint-maintenance-20261107
          BASE_REF: codex/knowledge-graph-live-maintenance-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle22-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle22-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle22-return.bundle)" = 5818
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle22-return.bundle
          git fetch ./agent-a-cycle22-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
