name: agent-a-cycle43-original-git-import
on:
  push:
    branches: [bridge/agent-a-cycle43-publish]
    paths: [.gitbridge/agent-a-cycle43.payload.b64]
permissions:
  contents: write
jobs:
  verify-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original Cycle43 Git commit and publish isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feffdb0d57ce83ebb32539818e07ea0a246ced04
          base64 --decode .gitbridge/agent-a-cycle43.payload.b64 > /tmp/agent-a-cycle43.bundle
          echo "aeab578ca7ad68c6962ec81ca311ac2ae8eae6598556e8a9b59a6461d8808ab0  /tmp/agent-a-cycle43.bundle" | sha256sum -c -
          git bundle verify /tmp/agent-a-cycle43.bundle
          git fetch /tmp/agent-a-cycle43.bundle refs/heads/agent-a-cycle43:refs/heads/bridge/agent-a-cycle43-candidate
          test "$(git rev-parse refs/heads/bridge/agent-a-cycle43-candidate)" = "1f3c724ae6dfab45ff1c974a7f3c9c8b2bc7f186"
          test "$(git rev-parse refs/heads/bridge/agent-a-cycle43-candidate^{tree})" = "f594dd4a7119555e550d5753394b0b49c55e82d3"
          test "$(git rev-parse refs/heads/bridge/agent-a-cycle43-candidate^)" = "feffdb0d57ce83ebb32539818e07ea0a246ced04"
          git merge-base --is-ancestor feffdb0d57ce83ebb32539818e07ea0a246ced04 refs/heads/bridge/agent-a-cycle43-candidate
          git push origin refs/heads/bridge/agent-a-cycle43-candidate:refs/heads/bridge/agent-a-cycle43-candidate
