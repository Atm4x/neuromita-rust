name: Bridge C4 verified overlay install exact commit
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-overlay-install.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Verify exact Git bundle and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-overlay.bundle
          test "$(sha256sum /tmp/c4-overlay.bundle | cut -d' ' -f1)" = '14dd74db15d022c67a386b6d293fe3f7b5a92fa608478642fd440a06b48e28fe'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-install-plan-preview-20261108
          test "$(git rev-parse FETCH_HEAD)" = 'f4d14f1e6da4527a5aa17a2a227f801ff7484f41'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-verified-remote-overlay-install-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = 'f4d14f1e6da4527a5aa17a2a227f801ff7484f41'
          git bundle verify /tmp/c4-overlay.bundle
          git fetch /tmp/c4-overlay.bundle refs/heads/codex/ai-platform-hub-c4-verified-overlay-install-20261108
          test "$(git rev-parse FETCH_HEAD)" = 'a2513556ce3ac55379b81ddf16269a5cd28a5160'
          git checkout --detach 'a2513556ce3ac55379b81ddf16269a5cd28a5160'
          test "$(git rev-parse 'HEAD^{tree}')" = 'd1a394fb944f2cc6b7f42c3823b0edbec9200566'
          git merge-base --is-ancestor 'f4d14f1e6da4527a5aa17a2a227f801ff7484f41' HEAD
          git diff --check 'f4d14f1e6da4527a5aa17a2a227f801ff7484f41' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-verified-remote-overlay-install-20261108
