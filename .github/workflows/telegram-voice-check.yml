name: Telegram Voice branch validation
on:
  push:
    branches:
      - codex/telegram-voice-47
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libssl-dev
      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.89.0
          rustup toolchain install 1.92.0 --profile minimal
      - name: One-time rustfmt sync from bridge changes
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          for path in $(git diff --name-only); do
            case "$path" in
              src/telegram_sidecar.rs|src/telegram_voice.rs|src/bin/neuromita-gui/runtime.rs) ;;
              *) echo "Unexpected rustfmt change: $path"; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegram_sidecar.rs src/telegram_voice.rs src/bin/neuromita-gui/runtime.rs
          git commit -m "style(telegram): apply rustfmt to bridge changes"
          git push origin HEAD:codex/telegram-voice-47
      - name: Python Telethon fake-transport tests
        run: python3 -m unittest discover -s tools/tests -p 'test_telegram_sidecar.py' -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile Slint Telegram GUI integration
        run: cargo +1.92.0 check --locked --offline --features gui --bin neuromita-gui
      - name: Telegram focused tests
        run: cargo test --locked --offline telegram_
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Full unit and integration suite
        run: cargo test --locked --offline
