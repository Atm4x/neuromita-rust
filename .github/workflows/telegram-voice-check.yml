name: Telegram Voice branch validation
on:
  push:
    branches:
      - codex/telegram-voice-47
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libssl-dev
      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.89.0
          rustup toolchain install 1.92.0 --profile minimal
      - name: Python Telethon fake-transport tests
        run: python3 -m unittest discover -s tools/tests -p 'test_telegram_sidecar.py' -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile Slint Telegram GUI integration
        run: cargo +1.92.0 check --locked --offline --features gui --bin neuromita-gui
      - name: Telegram focused tests
        run: cargo test --locked --offline telegram_
      - name: Clippy
        run: |
          set +e
          cargo clippy --locked --offline --all-targets -- -D warnings > /tmp/telegram-clippy.log 2>&1
          result=$?
          set -e
          cat /tmp/telegram-clippy.log
          if [ "$result" -ne 0 ]; then
            cp /tmp/telegram-clippy.log docs/03-runtime/telegram-ci-clippy.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/03-runtime/telegram-ci-clippy.log
            git commit -m "ci(telegram): capture clippy diagnostic for review"
            git push origin HEAD:codex/telegram-voice-47
          fi
          exit "$result"
      - name: Full unit and integration suite
        run: cargo test --locked --offline
