name: Bridge C4 complete selection preflight
on:
  push:
    branches: [bridge/c4-production-preflight-20261108]
    paths: [.github/workflows/bridge-c4-production-preflight.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-production-preflight-20261108
          fetch-depth: 0
      - name: Import exact verified incremental Git bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/preflight.bundle.xz
          test "$(sha256sum /tmp/preflight.bundle.xz | cut -d' ' -f1)" = '6e9960395ca127366c11f6fec148377f0fcdc39c1191f9fdd2ad0a3d42aafe83'
          xz -d -c /tmp/preflight.bundle.xz > /tmp/preflight.bundle
          test "$(sha256sum /tmp/preflight.bundle | cut -d' ' -f1)" = '5c56473e32622bb8c701f4f14cc1a9199fe73b6d956010afa191d02ef8003582'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-single-wheel-operation-20261108
          test "$(git rev-parse FETCH_HEAD)" = '667f3fe52708a91623fef1bb73696232509876a4'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-production-preflight-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = '667f3fe52708a91623fef1bb73696232509876a4'
          git bundle verify /tmp/preflight.bundle
          git fetch /tmp/preflight.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '4dd039e5715cba45406d69cfceeede6d3237b8da'
          git checkout --detach '4dd039e5715cba45406d69cfceeede6d3237b8da'
          test "$(git rev-parse 'HEAD^{tree}')" = 'a22bf43f29ec80bf5db24752e9213b55ae3b4d37'
          git merge-base --is-ancestor '667f3fe52708a91623fef1bb73696232509876a4' HEAD
          git diff --check '667f3fe52708a91623fef1bb73696232509876a4' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-production-preflight-20261108
