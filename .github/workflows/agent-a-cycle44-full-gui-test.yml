name: agent-a-cycle44-full-gui-test
on:
  push:
    branches:
      - bridge/agent-a-cycle44-gui-ci
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SLINT_BACKEND: "software"
      NEUROMITA_GUI_CAPTURE_DIR: /tmp/neuromita-gui-captures
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned original PR302
        run: |
          git fetch origin 1f3c724ae6dfab45ff1c974a7f3c9c8b2bc7f186
          git checkout --detach 1f3c724ae6dfab45ff1c974a7f3c9c8b2bc7f186
          test "$(git rev-parse HEAD)" = "1f3c724ae6dfab45ff1c974a7f3c9c8b2bc7f186"
          git fsck --full
      - name: Native GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig1-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Full desktop GUI binding test, actual AppWindow
        run: |
          mkdir -p "$NEUROMITA_GUI_CAPTURE_DIR"
          cargo +1.98.1 test --locked --offline --features gui --bin neuromita-gui existing_slint_bindings_retranslate_on_locale_change_and_catalog_revision -j 2 -- --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-a-cycle44-full-gui-captures
          path: /tmp/neuromita-gui-captures
          retention-days: 2
          if-no-files-found: ignore
