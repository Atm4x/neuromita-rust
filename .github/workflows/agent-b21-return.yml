name: Publish Agent B21 verified Git bundle
on:
  push:
    branches:
      - bridge/agent-b21-return-20261107
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55ecb2fe9aa62f66a653f48b93e3e255b30d50d7
          fetch-depth: 0
      - name: Import verified B21 commit and publish isolated branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=55ecb2fe9aa62f66a653f48b93e3e255b30d50d7
          EXPECTED=60832fc5125261cf75160531aa34960777bca434
          CHECKSUM=8bd96976edc2a5fa0dc7a5206de3286f841d93dc26a665c34e5b91f906f0c073
          SOURCE=refs/heads/codex/timeline-python-archive-parity-contract-20261107
          TARGET=refs/heads/codex/timeline-python-archive-parity-contract-20261107
          git fetch origin refs/heads/bridge/agent-b21-return-20261107
          git show FETCH_HEAD:.bridge/agent-b21-20261107.bundle.b64 | base64 --decode > /tmp/agent-b21.bundle
          echo "$CHECKSUM  /tmp/agent-b21.bundle" | sha256sum -c -
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/agent-b21.bundle
          git fetch /tmp/agent-b21.bundle "$SOURCE"
          IMPORTED="$(git rev-parse FETCH_HEAD)"
          test "$IMPORTED" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$IMPORTED"
          REMOTE="$(git ls-remote origin "$TARGET" | cut -f1)"
          if [[ -n "$REMOTE" && "$REMOTE" != "$EXPECTED" ]]; then
            echo "Destination ref unexpectedly exists at $REMOTE" >&2
            exit 1
          fi
          git update-ref "$TARGET" "$IMPORTED"
          if [[ "$REMOTE" != "$EXPECTED" ]]; then
            git push origin "$TARGET:$TARGET"
          fi
          echo "Published $TARGET at $IMPORTED"
