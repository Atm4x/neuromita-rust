name: Agent A cycle28 original variable transfer bundle import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle28-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original scoped variables commit and fast-forward feature only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: b974b168ab64ddba724964c7eb195201914d46be
          BUNDLE_SHA256: 7ca7305e78afec19ad74bba3c894adfe36723e31026351fe4fbc1bb2a5979d1e
          START_SHA: 48c3c2212963a524bc4f1617431e6532b3b1d551
          HEAD_SHA: 41bcf4de56a93c28b4fe439c2d15e7f90e704224
          FEATURE_REF: codex/knowledge-scoped-variable-transfer-20261107
          BASE_REF: codex/knowledge-memory-transfer-durable-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle28-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle28-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle28-return.bundle)" = 11840
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle28-return.bundle
          git fetch ./agent-a-cycle28-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
