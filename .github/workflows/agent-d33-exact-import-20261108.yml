name: Agent D33 exact-commit history bridge
on:
  push:
    branches:
      - codex/bridge-agent-d33-semantic-import-20261108
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original D33 commit before publication
        shell: bash
        run: |
          set -euo pipefail
          BASE=04c48ae3cacd9c68be166d83ee3857cf7cbf77e1
          HEAD=2261bd8caf42a0ffd658fbbc44c50eaaf999e8af
          TREE=7334f9837510e51f0d20c48eadd4a4944bc57fc0
          BRANCH=codex/python-presets-semantic-loss-guards-20261108
          base64 --decode .git-bridge/d33-original.patch.xz.b64 > /tmp/d33.patch.xz
          echo '5783ac74074c5a75feb02d5224bb0bedede62f054b04d094a12d905aef6c59c7  /tmp/d33.patch.xz' | sha256sum --check
          xz -d --stdout /tmp/d33.patch.xz > /tmp/d33.patch
          git fetch --no-tags origin refs/heads/codex/python-preset-historical-layouts-20261108
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test -z "$(git ls-remote --heads origin "refs/heads/$BRANCH")"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d33.patch
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" -eq 1
          git fsck --full
          git diff --check "$BASE" "$HEAD"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD"
