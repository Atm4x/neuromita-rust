name: Bridge C4 compact toolbar exact patch
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-compact-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Import exact C4 commit preserving SHA and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-compact.patch
          test "$(sha256sum /tmp/c4-compact.patch | cut -d' ' -f1)" = "6eb794428443163617b089e5500a75726c0577f68e95db8a7b33c1e9fac587b6"
          git fetch origin refs/heads/codex/ai-platform-hub-c4-guarded-category-transition-20261108
          test "$(git rev-parse FETCH_HEAD)" = "d3617389004a7823bdd373b9876545d5f2f24f34"
          git fetch origin refs/heads/codex/ai-platform-hub-c4-compact-toolbar-tabs-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = "d3617389004a7823bdd373b9876545d5f2f24f34"
          git checkout --detach "d3617389004a7823bdd373b9876545d5f2f24f34"
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git am --committer-date-is-author-date /tmp/c4-compact.patch
          test "$(git rev-parse HEAD)" = "ad9334cd0655ceccefd873b3165f9dc5b62e1c89"
          test "$(git rev-parse 'HEAD^{tree}')" = "ae211be20f28834578a4c44344a7ffab48082b13"
          git merge-base --is-ancestor "d3617389004a7823bdd373b9876545d5f2f24f34" HEAD
          git diff --check "d3617389004a7823bdd373b9876545d5f2f24f34" HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-compact-toolbar-tabs-20261108
