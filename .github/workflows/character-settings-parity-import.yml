name: Import verified character settings parity patch
on:
  push:
    branches:
      - codex/character-settings-memory-parity-20261103
    paths:
      - .github/bridge/character-settings-parity.patch.gz.b64
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import and publish verified source diff
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/bridge/character-settings-parity.patch.gz.b64 | gzip -dc > /tmp/character-settings-parity.patch
          echo "b974002b51c495250fe988f85c8580e20e092521a2b7391609e7b5d911374add  /tmp/character-settings-parity.patch" | sha256sum -c -
          git apply --check /tmp/character-settings-parity.patch
          git apply /tmp/character-settings-parity.patch
          rm .github/bridge/character-settings-parity.patch.gz.b64
          rm .github/workflows/character-settings-parity-import.yml
          rm .github/workflows/character-parity-bundle.yml
          git config user.name 'Atm4x'
          git config user.email '96025052+Atm4x@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "fix(gui): integrate character memory into PyQt-style Slint settings"
          git push origin HEAD:refs/heads/codex/character-settings-memory-parity-20261103
