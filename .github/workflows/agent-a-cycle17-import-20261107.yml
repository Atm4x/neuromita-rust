name: Agent A cycle17 verified incremental bundle import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle17-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and fast-forward original Agent A cycle17 commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: 22f8a3bbaf568b799ba1b8dfab320e7c1548860c
          BUNDLE_SHA256: b54e6ab3a35da41467a4c626c14009771aeb6badf393d0dfde6572f9b386a060
          START_SHA: efdf24bf4e0925dcdfdfdef3d32b255a5259c668
          HEAD_SHA: 7664bf4a83c26da11b4f5db6110136781a4de622
          FEATURE_REF: codex/knowledge-history-vector-modelspace-20261107
          BASE_REF: codex/knowledge-rag-history-source-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle17-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle17-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle17-return.bundle)" = 13969
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle17-return.bundle
          git fetch ./agent-a-cycle17-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
