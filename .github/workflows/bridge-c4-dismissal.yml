name: Bridge C4 preserved dismissal exact fast-forward
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-dismissal.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Verify follow-up commit and fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/c4-dismiss.bundle
          test "$(sha256sum /tmp/c4-dismiss.bundle | cut -d' ' -f1)" = '6501e73a2efa57ba593210b2c7d74a6060c6e44f1c9e6a7f7a1e5a369c29739a'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-operation-status-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = '6641714dbf486d8449f1cd63c025c54760e825bf'
          git bundle verify /tmp/c4-dismiss.bundle
          git fetch /tmp/c4-dismiss.bundle refs/heads/codex/ai-platform-hub-c4-operation-status-20261108
          test "$(git rev-parse FETCH_HEAD)" = '41faa98630bde388c0fb79112414482f53bc3702'
          git checkout --detach '41faa98630bde388c0fb79112414482f53bc3702'
          test "$(git rev-parse 'HEAD^{tree}')" = '29e2cc281f4e20dea4d6321a6d1d91f73fcb7b1f'
          git merge-base --is-ancestor '6641714dbf486d8449f1cd63c025c54760e825bf' HEAD
          git diff --check '6641714dbf486d8449f1cd63c025c54760e825bf' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-operation-status-20261108
