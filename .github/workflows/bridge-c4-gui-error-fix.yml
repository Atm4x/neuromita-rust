name: Bridge C4 GUI exhaustive error fix
on:
  push:
    branches: [bridge/c4-reviewed-wheel-admission-20261108]
    paths: [.github/workflows/bridge-c4-gui-error-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-reviewed-wheel-admission-20261108
          fetch-depth: 0
      - name: Verify and fast-forward second exact C4 commit
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/followup.bundle
          test "$(sha256sum /tmp/followup.bundle | cut -d' ' -f1)" = '453a645294777efffc3754d9d41080c3a32115b302aedd6d2e6ac3daa64046c0'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-reviewed-wheel-admission-20261108:refs/remotes/origin/candidate
          test "$(git rev-parse refs/remotes/origin/candidate)" = '265caea0b83489c26a12a2341d104110dda84342'
          git bundle verify /tmp/followup.bundle
          git fetch /tmp/followup.bundle refs/heads/work
          test "$(git rev-parse FETCH_HEAD)" = '723b3439147a0bfb1453fce1d9579b0df97e76aa'
          git checkout --detach '723b3439147a0bfb1453fce1d9579b0df97e76aa'
          test "$(git rev-parse HEAD^{tree})" = 'bfeeede69eb1ea26f368752218b10c23a2e36d20'
          git merge-base --is-ancestor '265caea0b83489c26a12a2341d104110dda84342' HEAD
          git diff --check '265caea0b83489c26a12a2341d104110dda84342' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-reviewed-wheel-admission-20261108
