name: P1 Cycle8 fast exact latest-main Slint GUI acceptance
on:
  push:
    branches: [bridge/p1-cycle8-stream-gui-fast-20261112]
permissions:
  contents: read
jobs:
  actual-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ce8ab65db37d4e30743b98149389883d48b671d
          persist-credentials: false
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "8ce8ab65db37d4e30743b98149389883d48b671d"
      - name: GUI Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev xvfb xauth
      - name: Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Executable GUI tests
        run: xvfb-run -a cargo +1.98.1 test --locked --offline --features gui --bin neuromita-gui -- --test-threads=1
