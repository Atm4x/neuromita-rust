name: Agent B69 exact-head backend
on:
  push:
    branches:
      - bridge/agent-b69-verify-20261108
jobs:
  exact-b69:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d3e73f75ef588653224b4a28ecfd20fc0addd1a
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact B69 SHA tree and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0d3e73f75ef588653224b4a28ecfd20fc0addd1a"
          test "$(git rev-parse HEAD^{tree})" = "933d3ee50afc629539d9d6d452dadf0d7a5edcaa"
          test "$(git rev-parse HEAD^)" = "f51a33a90c9e50637652b9faa1b0eaba7e586517"
      - name: Install Rust 1.98.1 and ALSA headers
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          rustc --version
      - name: B69 backend request observation integration
        run: |
          cargo test --locked --offline --lib app::regenerate_admission_tests -- --test-threads=2
          cargo test --locked --offline --lib regenerate -- --test-threads=2
      - name: Repeat cross-SQLite race
        shell: bash
        run: |
          for i in $(seq 1 10); do
            cargo test --locked --offline --lib handle_cancel_vs_independent_sqlite_acceptance_has_one_durable_winner -- --test-threads=2 >/dev/null
          done
      - name: Full filtered library suite
        run: cargo test --locked --offline --lib -- --test-threads=2 --skip ai_runtime::assets::generation::tests::approved_installer_stages_verifies_and_publishes_only_declared_assets
      - name: Static verification
        shell: bash
        run: |
          cargo check --locked --offline --all-targets
          cargo fmt --all -- --check
          git diff --check
