name: Agent A Cycle64 verified exact Git import
on:
  push:
    branches:
      - bridge/agent-a-cycle64-import-20261109
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish exact local commit
        shell: bash
        env:
          BASE: 947ce50a87ec9f12f83942aba16038bea54ceecd
          ORIGINAL: 83e70248bcaf82efe5333e6b0af3771fc399f42e
          TREE: b761b24987518975610c920b35ce1a1994431e5d
          SHA256: c3d1a2f1cfd3ad57dd3abb2e4cc111e273125b2df6855403d9d6d1e0fe7bbb5e
          DEST: codex/knowledge-r7-provider-deadline-postcheck-20261109
        run: |
          set -euo pipefail
          base64 --decode bridge-data/cycle64.bundle.b64 > cycle64.bundle
          test "$(wc -c < cycle64.bundle)" = 6188
          echo "$SHA256  cycle64.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify cycle64.bundle
          git fetch cycle64.bundle refs/heads/agent-a-cycle64-publish:refs/heads/cycle64-candidate
          test "$(git rev-parse refs/heads/cycle64-candidate)" = "$ORIGINAL"
          test "$(git rev-parse "$ORIGINAL^{tree}")" = "$TREE"
          test "$(git show -s --format=%P "$ORIGINAL")" = "$BASE"
          git merge-base --is-ancestor "$BASE" "$ORIGINAL"
          git fsck --full
          test -z "$(git ls-remote --heads origin "refs/heads/$DEST")"
          git push origin "$ORIGINAL:refs/heads/$DEST"
          printf '%s\n' "head=$ORIGINAL" "parent=$BASE" "tree=$TREE" "bundle_sha256=$SHA256" > cycle64-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-a-cycle64-git-receipt
          path: cycle64-verified.txt
          retention-days: 1
