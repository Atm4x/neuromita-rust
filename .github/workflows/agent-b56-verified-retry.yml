name: Agent B56 verified retry original Timeline intent
on:
  push:
    branches: [bridge/agent-b56-retry-20261108]
    paths: [bridge/agent-b56.patch.xz.b64]
permissions:
  contents: write
jobs:
  publish-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact SHA-256 patch, B55 parent and B56 Git tree
        shell: bash
        run: |
          set -euo pipefail
          base=2aabfdb40af31fdf2dc974b1077eec269df38a63
          tree=4c5ad08a28bb7c9f7d6d1ba82e5ea3f73cc4ffac
          branch=codex/timeline-b56-original-intent-retry-20261108
          base64 -d bridge/agent-b56.patch.xz.b64 >/tmp/agent-b56.patch.xz
          echo "c4493da609d1b703d427c42849e4ec84a27f62eca1a2847c04a59064e3921c25  /tmp/agent-b56.patch.xz" | sha256sum -c -
          xz -t /tmp/agent-b56.patch.xz
          xz -dc /tmp/agent-b56.patch.xz >/tmp/agent-b56.patch
          git switch --detach "$base"
          test "$(git rev-parse HEAD)" = "$base"
          git apply --check /tmp/agent-b56.patch
          git apply --index /tmp/agent-b56.patch
          test "$(git write-tree)" = "$tree"
          git -c user.name="Agent B" -c user.email="agent-b@neuro-mita.local" commit -m "feat(chat): retry failed reply with original Timeline EventId"
          git merge-base --is-ancestor "$base" HEAD
          git ls-remote --exit-code origin "refs/heads/$branch" && { echo "B56 target exists; refuse overwrite"; exit 1; } || test "$?" = 2
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "B56_REMOTE_SHA=$(git rev-parse HEAD)"
          echo "B56_VERIFIED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Install Linux GUI prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libudev-dev libxkbcommon-dev libx11-dev
      - name: Executable Timeline retry integration (new RequestId, original EventId, stale admission)
        run: cargo test --locked --offline --test vertical_slice conversation_retry_reuses_input_event_and_rejects_duplicate_or_stale_attempts -- --test-threads=1
      - name: Executable Slint retry callback with character revision A-B-A
        run: cargo test --locked --offline --features gui --bin neuromita-gui chat_retry_callback_preserves_original_request_identity_and_selection -- --test-threads=1
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
