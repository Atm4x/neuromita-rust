name: Agent B53 verified text revision and Slint callback
on:
  push:
    branches: [bridge/agent-b53-revise-message-20261108]
    paths: [bridge/agent-b53.patch.gz.b64]
permissions:
  contents: write
jobs:
  publish-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify SHA, exact parent and source tree, publish linearly
        shell: bash
        run: |
          set -euo pipefail
          base=d16e5426af508ba4fe53ac4be1fa99ab70d6bccd
          tree=b62fc0d411618a88f219bce060dcf89cd3101dbb
          branch=codex/timeline-b53-single-text-message-revise-20261108
          base64 -d bridge/agent-b53.patch.gz.b64 >/tmp/b53.patch.gz
          echo "c9b857a90ffb61d9b00864639decd43168666a307771cb086b34a3618222d573  /tmp/b53.patch.gz" | sha256sum -c -
          gzip -t /tmp/b53.patch.gz
          gzip -dc /tmp/b53.patch.gz >/tmp/b53.patch
          git switch --detach "$base"
          test "$(git rev-parse HEAD)" = "$base"
          git apply --check /tmp/b53.patch
          git apply --index /tmp/b53.patch
          test "$(git write-tree)" = "$tree"
          git -c user.name="Agent B" -c user.email="agent-b@neuro-mita.local" commit -m "feat(chat): revise observer-visible text messages by canonical EventId"
          git merge-base --is-ancestor "$base" HEAD
          git ls-remote --exit-code origin "refs/heads/$branch" && { echo "B53 branch exists"; exit 1; } || test "$?" = 2
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libudev-dev libxkbcommon-dev libx11-dev
      - name: Execute canonical text revision integration
        run: cargo test --locked --offline --test vertical_slice conversation_single_message_revision_is_text_only_observer_scoped_and_anchor_atomic -- --test-threads=1
      - name: Execute Slint Edit and A-B-A callbacks
        run: cargo test --locked --offline --features gui --bin neuromita-gui chat_message_revision_callback_is_fenced_across_character_reselection -- --test-threads=1
      - name: Verify formatting
        run: cargo fmt --all -- --check
