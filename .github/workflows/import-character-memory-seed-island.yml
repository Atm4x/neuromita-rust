name: Publish verified one-time Memory island Git bundle
on:
  push:
    branches:
      - bridge/character-memory-seed-island-publish-20261103
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original commit, author and tree; publish exact objects
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/bridge/character-memory-seed-island.bundle.b64"
          if [[ ! -f "$FILE" ]]; then
            echo "Awaiting verified bundle"
            exit 0
          fi
          BASE="ab46d9d5b5a13bc4a342f35f4d96351622297e77"
          HEAD="1aff12412a9da5a748dbe15c8643ce9d03a304b2"
          REF="refs/heads/codex/character-memory-seed-island-20261103"
          git fetch origin refs/heads/codex/character-memory-idempotent-20261103:refs/remotes/origin/verified-memory-base
          test "$(git rev-parse refs/remotes/origin/verified-memory-base)" = "$BASE"
          base64 -d "$FILE" > /tmp/character-memory-seed-island.bundle
          echo "5ae5aab6e4700083682610cb5b58d2971e210659c528c442245299090bda2591  /tmp/character-memory-seed-island.bundle" | sha256sum -c -
          git bundle verify /tmp/character-memory-seed-island.bundle
          git fetch /tmp/character-memory-seed-island.bundle "$REF:refs/heads/verified-memory-seed-island"
          test "$(git rev-parse refs/heads/verified-memory-seed-island)" = "$HEAD"
          test "$(git rev-parse "$HEAD^")" = "$BASE"
          test "$(git rev-parse "$HEAD^{tree}")" = "9a63058d7baff93c78f9e873ef140fe92f09e6d5"
          test "$(git show -s --format='%an <%ae>|%cn <%ce>' "$HEAD")" = "Atm4x <mrtaktplay@gmail.com>|Atm4x <mrtaktplay@gmail.com>"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git push origin "refs/heads/verified-memory-seed-island:$REF"
          git ls-remote origin "$REF" | grep -q "^$HEAD[[:space:]]"
          echo "Original commit published without modifying main"
