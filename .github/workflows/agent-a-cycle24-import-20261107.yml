name: Agent A cycle24 verified Slint Graph Reindex bundle import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle24-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original Agent A commit and fast-forward scoped branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: 2b0e7d5e01163f353ef93ec4f3ac2826f2ba6899
          BUNDLE_SHA256: 20db50185970de3611eb5152ff51378145788a022f3c2486e293b8116bc926fd
          START_SHA: 1ba8db3fd283ed97dd1e8b751f430214892c456b
          HEAD_SHA: f4cc5059a185fb8700a0f3daae829d24503672ec
          FEATURE_REF: codex/knowledge-graph-production-20261107
          BASE_REF: codex/knowledge-configured-graph-extractor-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle24-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle24-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle24-return.bundle)" = 4507
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle24-return.bundle
          git fetch ./agent-a-cycle24-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
