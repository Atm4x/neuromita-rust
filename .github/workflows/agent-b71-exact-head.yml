name: Agent B71 exact-head backend
on:
  push:
    branches:
      - bridge/agent-b71-verify-20261109
jobs:
  exact-b71:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86a4dd40453ff4c460bb3089f3a34171b140fe6d
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact B71 SHA tree and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "86a4dd40453ff4c460bb3089f3a34171b140fe6d"
          test "$(git rev-parse HEAD^{tree})" = "9b5f297024d358101664ae6c8cc6757816e994d9"
          test "$(git rev-parse HEAD^)" = "a7e161ceeccf2da61ebce65bc0903461cd436331"
      - name: Install Rust 1.98.1 and ALSA headers
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          rustc --version
      - name: B71 indexed lifecycle and request tests
        run: |
          cargo test --locked --offline --lib regenerate_enumeration_tests -- --test-threads=2
          cargo test --locked --offline --lib app::regenerate_admission_tests -- --test-threads=2
      - name: Full filtered library suite
        run: cargo test --locked --offline --lib -- --test-threads=2 --skip ai_runtime::assets::generation::tests::approved_installer_stages_verifies_and_publishes_only_declared_assets
      - name: Static verification
        shell: bash
        run: |
          cargo check --locked --offline --all-targets
          cargo fmt --all -- --check
          git diff --check
