name: Agent A cycle16 verified incremental bundle import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle16-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download and verify original Agent A Git bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: f6d4881d90a638c24a9ae7986c28add488f50f9e
          BUNDLE_SHA256: f30a68bdc79eba5ba5aa70483058ad52c29425a88f62347b61d7609a286edd74
          START_SHA: b989d8b73ba85d871e99ddb0c16a50459467dc49
          HEAD_SHA: efdf24bf4e0925dcdfdfdef3d32b255a5259c668
          FEATURE_REF: codex/knowledge-rag-history-source-20261107
          BASE_REF: codex/knowledge-slint-forgotten-inspection-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle16-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle16-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle16-return.bundle)" = 8908
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle16-return.bundle
          git fetch ./agent-a-cycle16-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
