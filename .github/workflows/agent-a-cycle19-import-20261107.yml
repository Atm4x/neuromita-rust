name: Agent A cycle19 verified generation-history bundle import
on:
  push:
    branches: [bridge/import-agent-a-cycle19-20261107]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify single-ref Agent A original objects and fast-forward
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: b820ebb603ec1edc020f245a59ddce6abd51ee0e
          BUNDLE_SHA256: 648cafa22df0b6d36383c47ab0b6d80f48f968e9d87bde56d97e383880786173
          START_SHA: 462343d49cf3368f23fe252965239452b8bae7c4
          HEAD_SHA: 36915fe959e7edff80cde303c6e8427f42f3643a
          FEATURE_REF: codex/knowledge-generation-history-policy-20261107
          BASE_REF: codex/knowledge-timeline-fts-source-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle19-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle19-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle19-return.bundle)" = 10517
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle19-return.bundle
          git fetch ./agent-a-cycle19-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
