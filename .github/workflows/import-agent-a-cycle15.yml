name: Import Agent A Cycle15 Slint Forgotten Inspection
on:
  push:
    branches:
      - bridge/import-agent-a-cycle15-20261107
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and fast-forward original GUI feature commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=4ccf2dfdc9f8e0f1f09e78fa3b851fe247aaa3bf
          TARGET=b989d8b73ba85d871e99ddb0c16a50459467dc49
          BRANCH=codex/knowledge-slint-forgotten-inspection-20261107
          git cat-file -e "$BASE^{commit}"
          sha256sum -c .bridge/agent-a-cycle15-slint-recall-fix.bundle.sha256
          git bundle verify .bridge/agent-a-cycle15-slint-recall-fix.bundle
          git fetch --no-tags .bridge/agent-a-cycle15-slint-recall-fix.bundle "refs/heads/$BRANCH:refs/remotes/imported/agent-a"
          test "$(git rev-parse refs/remotes/imported/agent-a)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          CURRENT="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$CURRENT" = "$BASE"
          git push origin "$TARGET:refs/heads/$BRANCH"
