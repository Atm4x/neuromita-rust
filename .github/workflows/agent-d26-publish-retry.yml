name: Publish verified D26 patch
on:
  push:
    branches:
      - bridge/agent-d26-publish-retry-20261107
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact verified patch and fast-forward D26 branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/bridge/d26.patch.xz.b64 /tmp/d26.patch.xz.b64
          git checkout --detach 5f682d2ce56e950168c0c04deb158a1775d92f39
          test "$(git rev-parse HEAD^{tree})" = "22eb0666798b102d54b8998951ff977447b45f4d"
          base64 -d /tmp/d26.patch.xz.b64 | xz -dc > /tmp/d26.patch
          echo "b7947bb5e42f2824b4dc3b23c0cec7ebae5b94244d19de33f10ea0337e128e9e  /tmp/d26.patch" | sha256sum -c -
          git apply --check /tmp/d26.patch
          git apply /tmp/d26.patch
          git add docs/03-runtime/updater-helper-handoff.md src/updater.rs src/updater/activation.rs src/updater/python_core_activation.rs
          git diff --cached --check
          test "$(git write-tree)" = "a7c8ff88262a5e70bbbdc987042b84650821c238"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(updater): recoverable Python entry-file transaction (Refs #44)"
          test "$(git rev-parse HEAD^{tree})" = "a7c8ff88262a5e70bbbdc987042b84650821c238"
          git push origin HEAD:refs/heads/codex/updater-python-core-transaction-20261107
