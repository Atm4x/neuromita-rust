name: P1 post-merge atomic character and offline CLI acceptance
on:
  push:
    branches: [bridge/p1-postmerge-verification-20261111]
permissions:
  contents: read
jobs:
  rust-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adcc3156a8fd33487d7e886dc26bf5c6d19ba1df
      - name: Install GUI and FFI headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev
      - name: Pin Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustc +1.98.1 --version
      - name: Fmt
        run: cargo +1.98.1 fmt --all -- --check
      - name: All-target offline check
        run: cargo +1.98.1 check --locked --offline --all-targets
      - name: Library tests
        run: cargo +1.98.1 test --locked --offline --lib -- --test-threads=2
      - name: Settings executable tests
        run: cargo +1.98.1 test --locked --offline --test settings_cli -- --test-threads=2
      - name: Python settings import executable tests
        run: cargo +1.98.1 test --locked --offline --test python_settings_import -- --test-threads=2
      - name: Three-file settings tests
        run: cargo +1.98.1 test --locked --offline --test python_preset_three_file -- --test-threads=2
      - name: GUI all-target compile
        run: cargo +1.98.1 check --locked --offline --features gui --all-targets
