name: Import exact C4 local patch
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-patch-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Verify exact Git patch and fast-forward C4 candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/c4.patch
          git fetch origin refs/heads/codex/ai-platform-hub-c4-pyqt-card-parity-20261107
          test "$(git rev-parse FETCH_HEAD)" = 138908049b9c1f970877381bbb69b503cc0f8393
          git fetch origin refs/heads/codex/ai-platform-hub-c4-guarded-category-transition-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = 138908049b9c1f970877381bbb69b503cc0f8393
          git checkout --detach 138908049b9c1f970877381bbb69b503cc0f8393
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git am --committer-date-is-author-date /tmp/c4.patch
          test "$(git rev-parse HEAD)" = d3617389004a7823bdd373b9876545d5f2f24f34
          test "$(git rev-parse 'HEAD^{tree}')" = bbac68807dc45987febd81b565fbe577bb857bbe
          git merge-base --is-ancestor 138908049b9c1f970877381bbb69b503cc0f8393 HEAD
          git diff --check 138908049b9c1f970877381bbb69b503cc0f8393 HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-guarded-category-transition-20261108
