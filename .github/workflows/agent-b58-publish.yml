name: Agent B58 publish verified patch
on:
  push:
    branches:
      - bridge/agent-b58-source-20261108
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b37fd54b93a093b2288737f014876cc383506c5
          fetch-depth: 2
      - name: Apply exact B58 patch and publish stacked branch
        shell: bash
        env:
          PATCH_GZIP_BASE64: ""
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0b37fd54b93a093b2288737f014876cc383506c5"
          test "$(git rev-parse HEAD^{tree})" = "6ff5acbcdb695943840ad55e67945d738b6053b6"
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip -d > "$RUNNER_TEMP/B58.patch"
          git apply --check "$RUNNER_TEMP/B58.patch"
          git apply "$RUNNER_TEMP/B58.patch"
          git add src/timeline/mod.rs src/timeline/storage/sqlite.rs docs/02-ui/atomic-checkpoint-fork-selection.md
          git diff --cached --check
          git config user.name 'Agent B58'
          git config user.email 'agent-b58@example.invalid'
          git commit -m 'timeline: atomic checkpoint fork with selection CAS and rollback proofs'
          test "$(git rev-parse HEAD^{tree})" = "2f8551c39fb13264110045f95a51c2a10deafb25"
          git push origin HEAD:refs/heads/codex/timeline-b58-atomic-checkpoint-fork-20261108
