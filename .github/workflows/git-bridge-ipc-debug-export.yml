name: Git Bridge - IPC Debug bundle export refreshed
on:
  push:
    branches:
      - bridge/ipc-debug-bundle-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact PR head and latest main as Git bundle
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git branch ipc-pr '9a0906f77786825fff24116e6ce1a6099966be53'
          git branch main-export refs/remotes/origin/main
          git bundle create neuromita-rust-ipc-debug.bundle refs/heads/ipc-pr refs/heads/main-export
          git bundle verify neuromita-rust-ipc-debug.bundle
          sha256sum neuromita-rust-ipc-debug.bundle > neuromita-rust-ipc-debug.bundle.sha256
          printf 'PR_HEAD=%s\nMAIN_HEAD=%s\n' "$(git rev-parse ipc-pr)" "$(git rev-parse main-export)" > git-bridge-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neuromita-rust-ipc-debug-git-bundle
          path: |
            neuromita-rust-ipc-debug.bundle
            neuromita-rust-ipc-debug.bundle.sha256
            git-bridge-manifest.txt
          if-no-files-found: error
          retention-days: 7
