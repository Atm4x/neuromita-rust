name: Agent D56 exact isolated Windows handoff import
on:
  push:
    branches:
      - bridge/agent-d56-guard-handoff-20261109
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original D56 patch and publish exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=2791700dbbedda574a8fb587e128701980565b85
          EXPECTED=6b22584ff5162331e1b5ab837feae2be31a284ea
          TREE=3f0f8f4f60bb07c1b800a19da3fe39300f7e80a7
          cat .agent-bridge/d56-part-0{1,2,3,4,5,6}.b64 | tr -d '\n' | base64 -d >/tmp/d56.patch.br
          echo 'f69774cf7479bc39d13a83eae260be3476d8359599cdf9c39c9645012743870d  /tmp/d56.patch.br' | sha256sum -c
          node -e "const fs=require('node:fs');const z=require('node:zlib');fs.writeFileSync('/tmp/d56.patch',z.brotliDecompressSync(fs.readFileSync('/tmp/d56.patch.br')))"
          echo '483530db0007c89147f307f9984856ace28de39f10735e9b863ccf75ca79ea4b  /tmp/d56.patch' | sha256sum -c
          git fetch origin "$BASE"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d56.patch
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          git diff --check HEAD^ HEAD
          git fsck --full
          git push origin HEAD:refs/heads/codex/agent-d56-isolated-windows-handoff-20261109
