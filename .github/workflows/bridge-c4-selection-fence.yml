name: Bridge C4 guarded catalog identity
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-selection-fence.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Import exact C4 fix bundle and publish fast-forward
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/c4-selection.bundle
          test "$(sha256sum /tmp/c4-selection.bundle | cut -d' ' -f1)" = '151c96e6796f4d6c834b3b87d5f6b2b4a6771f2ac1274c8a9730eb54704449d7'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-tested-projection-warning-20261108
          test "$(git rev-parse FETCH_HEAD)" = 'd75e2a4690e19a7bf3aeafb026b528f2dda0c65d'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-selection-fence-install-review-20261108:refs/remotes/origin/c4-selection
          test "$(git rev-parse refs/remotes/origin/c4-selection)" = 'd75e2a4690e19a7bf3aeafb026b528f2dda0c65d'
          git bundle verify /tmp/c4-selection.bundle
          git fetch /tmp/c4-selection.bundle refs/heads/codex/ai-platform-hub-c4-selection-fence-install-review-20261108
          test "$(git rev-parse FETCH_HEAD)" = '372568445b9282993e5deb6026df0a055f13fd95'
          git checkout --detach '372568445b9282993e5deb6026df0a055f13fd95'
          test "$(git rev-parse 'HEAD^{tree}')" = '7ccf37403ae0b02130179f790e1b3cd7ae1298e0'
          git merge-base --is-ancestor 'd75e2a4690e19a7bf3aeafb026b528f2dda0c65d' HEAD
          git diff --check 'd75e2a4690e19a7bf3aeafb026b528f2dda0c65d' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-selection-fence-install-review-20261108
