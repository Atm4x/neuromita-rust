name: Beat Sync cache verification

on:
  push:
    branches:
      - codex/beat-sync-cache-29
  pull_request:
    paths:
      - src/music.rs
      - tests/beat_sync_cache.rs
      - .github/workflows/beat-sync-cache.yml

permissions:
  contents: read

jobs:
  beat-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native audio headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Beat Sync cache acceptance tests
        run: cargo test --locked --offline --test beat_sync_cache
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
