name: Beat Sync cache verification

on:
  push:
    branches:
      - codex/beat-sync-cache-29
  pull_request:
    paths:
      - src/music.rs
      - tests/beat_sync_cache.rs
      - .github/workflows/beat-sync-cache.yml

permissions:
  contents: write

jobs:
  beat-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Linux native audio headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust files and publish formatting if needed
        run: |
          cargo fmt --all
          if ! git diff --quiet -- src/music.rs src/music/ src/game_link.rs src/app.rs src/bin/beat_sync.rs tests/beat_sync_runtime.rs tests/beat_sync_cache.rs tests/game_beat_sync.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/music.rs src/music/ src/game_link.rs src/app.rs src/bin/beat_sync.rs tests/beat_sync_runtime.rs tests/beat_sync_cache.rs tests/game_beat_sync.rs
            git commit -m 'style(music): rustfmt on native Beat Sync runtime'
            git fetch origin codex/beat-sync-cache-29
            git rebase FETCH_HEAD
            git push origin HEAD:codex/beat-sync-cache-29
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Beat Sync cache acceptance tests
        run: cargo test --locked --offline --test beat_sync_cache
      - name: Run real WAV and runtime delivery fixtures
        run: cargo test --locked --offline --test beat_sync_runtime
      - name: Run GameLink TCP Beat Sync fixture
        run: cargo test --locked --offline --test game_beat_sync
      - name: Full offline Rust suite
        run: cargo test --locked --offline
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
