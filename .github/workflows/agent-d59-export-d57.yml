name: Agent D59 pinned D57 source delta
on:
  push:
    branches:
      - bridge/agent-d59-export-d57-20261110
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agent-d57-bounded-parent-shutdown-20261109
          fetch-depth: 2
          persist-credentials: false
      - name: Pin original D57
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85b081ca858e78e65e9b96c103bb868ec3432c6d
          test "$(git rev-parse HEAD^{tree})" = 18418a26a6cc462a2fb07c91ccbea10f46900719
          test "$(git rev-parse HEAD^)" = 6b22584ff5162331e1b5ab837feae2be31a284ea
          git bundle create d59-d57-only.bundle HEAD^..HEAD
          git bundle verify d59-d57-only.bundle
          sha256sum d59-d57-only.bundle > d59-d57-only.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: d59-d57-only
          path: |
            d59-d57-only.bundle
            d59-d57-only.sha256
          retention-days: 2
