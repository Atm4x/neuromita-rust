name: Git Bridge MCP Cycle12B Tool Settings Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify local source bundle and stage incremental commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=a15d41620dfb5dad2895cfb3fcf6ee8e1fb90dd0
          EXPECTED=d6040a65992bdad17daa7f460addedc148707364
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle12b.bundle
          echo "4f63b2eee4be08012d0ff632529aaef3be452ee6f8ae09f716f2f8411636bb7b  /tmp/cycle12b.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle12b.bundle
          git fetch /tmp/cycle12b.bundle refs/heads/ipc-candidate:refs/heads/ipc-cycle12b-imported
          test "$(git rev-parse refs/heads/ipc-cycle12b-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle12b-imported:refs/heads/bridge/ipc-cycle12b-staged-20261115
