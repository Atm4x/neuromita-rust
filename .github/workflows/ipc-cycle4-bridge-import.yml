name: Git Bridge MCP Cycle14B GUI Telegram State Watch
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import exact locally checked GUI subscription fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=81d8ecbec13772a04c00ea7d74502e799cd2688c
          EXPECTED=fcff568e698753f3784f2516513b77c0b18ea52f
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle14b.bundle
          echo "9a703e53f3403ac15bccd317272b0978456acc340ee240b83f156db573a682f2  /tmp/cycle14b.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle14b.bundle
          git fetch /tmp/cycle14b.bundle refs/heads/ipc-candidate:refs/heads/ipc-cycle14b-imported
          test "$(git rev-parse refs/heads/ipc-cycle14b-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle14b-imported:refs/heads/bridge/ipc-cycle14b-staged-20261115
