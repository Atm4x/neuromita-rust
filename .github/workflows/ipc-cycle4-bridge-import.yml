name: Git Bridge IPC restart evidence import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify instance ID instrumentation commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=c28bfbadafc0c62b870e1ff555eadfd429923322
          EXPECTED=f860ab109185247a56f121d8ed2068e9f3ff24e0
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/ipc-restart.bundle
          echo "b32ecc7b05c3e95fb31dc342c77c2968ee84fdc5c6833809cd5a5f3dd52c07b5  /tmp/ipc-restart.bundle" | sha256sum -c -
          git bundle verify /tmp/ipc-restart.bundle
          git fetch /tmp/ipc-restart.bundle refs/heads/ipc-cycle6-restart-export:refs/heads/ipc-restart-imported
          test "$(git rev-parse refs/heads/ipc-restart-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git push origin refs/heads/ipc-restart-imported:refs/heads/bridge/ipc-cycle6-restart-staged-20261114
