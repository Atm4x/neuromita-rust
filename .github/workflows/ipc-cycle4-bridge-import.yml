name: Git Bridge MCP Cycle13 Speech Capture Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact locally tested speech GUI/MCP delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=d6040a65992bdad17daa7f460addedc148707364
          EXPECTED=da5eb860cfab238726c0b5268dd9c2d1d5ef0667
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle13.bundle
          echo "28113c827dc98cab408d810a0be444909fd9a8a73482e8a8a9ce025b17545826  /tmp/cycle13.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle13.bundle
          git fetch /tmp/cycle13.bundle HEAD:refs/heads/ipc-cycle13-imported
          test "$(git rev-parse refs/heads/ipc-cycle13-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle13-imported:refs/heads/bridge/ipc-cycle13-staged-20261115
