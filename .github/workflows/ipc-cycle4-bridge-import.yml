name: Git Bridge MCP Cycle13B Speech Selection Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact GUI selected route instrumentation
        shell: bash
        run: |
          set -euo pipefail
          BASE=da5eb860cfab238726c0b5268dd9c2d1d5ef0667
          EXPECTED=4bf4716da15d471d6f527a42b5e34893529530ad
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle13b.bundle
          echo "ded7c56a6b9b2acec8c1c0f891a0e3c2de7d2edcd49a61c7721e708ca68de65b  /tmp/cycle13b.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle13b.bundle
          git fetch /tmp/cycle13b.bundle HEAD:refs/heads/ipc-cycle13b-imported
          test "$(git rev-parse refs/heads/ipc-cycle13b-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle13b-imported:refs/heads/bridge/ipc-cycle13b-staged-20261115
