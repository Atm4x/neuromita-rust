name: Git Bridge MCP Cycle12 Speech Presenter Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source bundle and stage matching local commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=9544d443fd9094968eba22a2cfbfff669ea81bee
          EXPECTED=a15d41620dfb5dad2895cfb3fcf6ee8e1fb90dd0
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle12.bundle
          echo "c35aaad9f2eb578783cc9a41a03c99307d052dd4cb5c9d01e84fdbde2a373cff  /tmp/cycle12.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle12.bundle
          git fetch /tmp/cycle12.bundle refs/heads/ipc-candidate:refs/heads/ipc-cycle12-imported
          test "$(git rev-parse refs/heads/ipc-cycle12-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle12-imported:refs/heads/bridge/ipc-cycle12-staged-20261115
          git rev-parse "$EXPECTED"
