name: Git Bridge IPC MCP source import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify local Git bundle and publish isolated import ref
        shell: bash
        run: |
          set -euo pipefail
          BASE=540a6f92aee2a14c5b9bca2bb4253dbe578bc6a2
          EXPECTED=fe808f32cc5af9a0c4e3884d2b97a1a75052b55f
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/ipc-mcp.bundle
          echo "d2caca4f52bc3cbfafff0eaed5b938886b93a4c6241f60ea76e1a67f88ddc2b5  /tmp/ipc-mcp.bundle" | sha256sum -c -
          git bundle verify /tmp/ipc-mcp.bundle
          git fetch /tmp/ipc-mcp.bundle refs/heads/ipc-cycle4-integrate:refs/heads/ipc-mcp-imported
          test "$(git rev-parse refs/heads/ipc-mcp-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git push origin refs/heads/ipc-mcp-imported:refs/heads/bridge/ipc-mcp-imported-20261114
