name: Git Bridge IPC GameLink source import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify one local commit and publish isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=fe808f32cc5af9a0c4e3884d2b97a1a75052b55f
          EXPECTED=c28bfbadafc0c62b870e1ff555eadfd429923322
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/ipc-cycle6.bundle
          echo "3038607dbb00afdd4eeb0f219080fe94106b473a6c6f509bf1d5fe071385d1b1  /tmp/ipc-cycle6.bundle" | sha256sum -c -
          git bundle verify /tmp/ipc-cycle6.bundle
          git fetch /tmp/ipc-cycle6.bundle refs/heads/ipc-cycle6-export:refs/heads/ipc-cycle6-imported
          test "$(git rev-parse refs/heads/ipc-cycle6-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git push origin refs/heads/ipc-cycle6-imported:refs/heads/bridge/ipc-cycle6-staged-20261114
