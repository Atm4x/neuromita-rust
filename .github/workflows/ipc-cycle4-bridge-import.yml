name: Git Bridge MCP Cycle16 Seven GUI Commands
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify typed Presenter parity commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=4e445f5011c8c2bb8f3ff33ab7a4529d7b604e2e
          EXPECTED=a9318805944704a9551deea878595b220540404b
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle16.bundle
          echo "810531e29b1b0b095d2472d527e152a8d2c55d07a672dbf79a08353a8d9e73ae  /tmp/cycle16.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle16.bundle
          git fetch /tmp/cycle16.bundle HEAD:refs/heads/ipc-cycle16-imported
          test "$(git rev-parse refs/heads/ipc-cycle16-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle16-imported:refs/heads/bridge/ipc-cycle16-staged-20261115
