name: Git Bridge MCP Cycle 10 incoming bundle
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source and stage changes over updated PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PR_HEAD=5e1d7dbf2404ef08d08abc45581d3172358aa24b
          EXPECTED_LOCAL_HEAD=52a8a34fea51717d5522eaa8f87a29b0cad35281
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$EXPECTED_PR_HEAD"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle10.bundle
          echo "950bc24134b75805e592c78108169f143920c28e3d4c3c616edb857e2f11b1df  /tmp/cycle10.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle10.bundle
          git fetch /tmp/cycle10.bundle refs/heads/codex/mcp-presenter-control-20261114:refs/heads/cycle10-source
          test "$(git rev-parse refs/heads/cycle10-source)" = "$EXPECTED_LOCAL_HEAD"
          git merge-base --is-ancestor 8f1b6688975ffdf01ad5e21574ed98226f872b37 cycle10-source
          git switch -c cycle10-stage "$EXPECTED_PR_HEAD"
          git -c user.name='Git Bridge' -c user.email='git-bridge@users.noreply.github.com' cherry-pick "$EXPECTED_LOCAL_HEAD"
          git diff "$EXPECTED_PR_HEAD" --check
          git push origin refs/heads/cycle10-stage:refs/heads/bridge/ipc-cycle10-staged-20261115
          git rev-parse HEAD
