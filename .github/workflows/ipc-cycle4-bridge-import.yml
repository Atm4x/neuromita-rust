name: Git Bridge MCP Cycle15 Remote Voice Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify local Rust source and stage on PR 446
        shell: bash
        run: |
          set -euo pipefail
          BASE=fcff568e698753f3784f2516513b77c0b18ea52f
          EXPECTED=4e445f5011c8c2bb8f3ff33ab7a4529d7b604e2e
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle15.bundle
          echo "4bfe9d62a9e306cdae1e92fe885b5ed786a12fcd8880bd888b5c6832c32563dd  /tmp/cycle15.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle15.bundle
          git fetch /tmp/cycle15.bundle HEAD:refs/heads/ipc-cycle15-imported
          test "$(git rev-parse refs/heads/ipc-cycle15-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle15-imported:refs/heads/bridge/ipc-cycle15-final-staged-20261115
