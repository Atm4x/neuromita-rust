name: Git Bridge MCP Cycle14 Telegram Admin Import
on:
  push:
    branches:
      - bridge/ipc-cycle4-import-20261114
    paths:
      - .bridge/ipc-cycle4-outgoing.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact locally checked GUI and MCP Telegram commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=4bf4716da15d471d6f527a42b5e34893529530ad
          EXPECTED=81d8ecbec13772a04c00ea7d74502e799cd2688c
          git fetch origin refs/heads/bridge/ipc-cycle4-candidate-20261114:refs/remotes/origin/ipc-candidate
          test "$(git rev-parse refs/remotes/origin/ipc-candidate)" = "$BASE"
          base64 -d .bridge/ipc-cycle4-outgoing.b64 > /tmp/cycle14.bundle
          echo "9799bbcc92b4a4edf668dfce231cf178fb3006001cbf208821285c6a916e5911  /tmp/cycle14.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle14.bundle
          git fetch /tmp/cycle14.bundle refs/heads/ipc-candidate:refs/heads/ipc-cycle14-imported
          test "$(git rev-parse refs/heads/ipc-cycle14-imported)" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git diff "$BASE" "$EXPECTED" --check
          git push origin refs/heads/ipc-cycle14-imported:refs/heads/bridge/ipc-cycle14-staged-20261115
