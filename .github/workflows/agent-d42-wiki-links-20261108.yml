name: Agent D42 exact Wiki settings deep links import and native GUI checks
on:
  push:
    branches: [codex/bridge-agent-d42-wiki-deep-links-20261108]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce original D42 SHA and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=23934195ba8116d0e492103774bb5fce88dce0bf
          HEAD=5aca1be732d0e12279b10c4e2d974e9105833480
          TREE=c182cfa0812d91899829fe1800360bcef840972d
          BRANCH=codex/agent-d42-wiki-deep-links-20261108
          cat .git-bridge/d42.0{0..2} >/tmp/d42.patch.xz.b64
          test "$(wc -c </tmp/d42.patch.xz.b64)" -eq 5040
          base64 -d /tmp/d42.patch.xz.b64 >/tmp/d42.patch.xz
          echo 'cd0a62e93668089c9b5e3aec195c97c2eaab7856b36926258bffacc4d9e86502  /tmp/d42.patch.xz' | sha256sum -c
          xz -d -c /tmp/d42.patch.xz >/tmp/d42.patch
          echo '54b9f128939234494b2f0ca0688e084c21acf86d7829c60fadc523361a3dc3aa  /tmp/d42.patch' | sha256sum -c
          git fetch --no-tags origin refs/heads/codex/onboarding-wiki-startup-20261108
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test -z "$(git ls-remote --heads origin "refs/heads/$BRANCH")"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d42.patch
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" -eq 1
          git diff --check "$BASE" "$HEAD"
          git fsck --full
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD"
  windows-native:
    needs: import
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agent-d42-wiki-deep-links-20261108
          fetch-depth: 0
      - name: Pin product commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5aca1be732d0e12279b10c4e2d974e9105833480
          test "$(git rev-parse HEAD^{tree})" = c182cfa0812d91899829fe1800360bcef840972d
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Native Wiki router and Slint feature tests
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --offline --lib onboarding::wiki::tests -- --test-threads=2
          cargo check --locked --offline --features gui --bin neuromita-gui
          cargo check --locked --offline --all-targets
  linux-gui-input:
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agent-d42-wiki-deep-links-20261108
          fetch-depth: 0
      - name: Pin product commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5aca1be732d0e12279b10c4e2d974e9105833480
          test "$(git rev-parse HEAD^{tree})" = c182cfa0812d91899829fe1800360bcef840972d
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install genuine X11 GUI dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb xdotool imagemagick libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev lld
      - name: Build full Slint GUI
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --locked --offline --features gui --bin neuromita-gui -j 2
      - name: Open real Wiki reader and document getting-started links
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SLINT_BACKEND: 'winit-femtovg'
        run: |
          set -euo pipefail
          mkdir -p e2e-evidence
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -euo pipefail <<'SCRIPT'
          ROOT="$RUNNER_TEMP/d42-portable"
          APP="$GITHUB_WORKSPACE/target/debug/neuromita-gui"
          evidence="$GITHUB_WORKSPACE/e2e-evidence"
          mkdir -p "$ROOT"
          "$APP" --data-dir "$ROOT" >"$evidence/gui.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          window=""
          for n in $(seq 1 50); do
            window=$(xdotool search --onlyvisible --name NeuroMita 2>/dev/null | tail -1 || true)
            [ -n "$window" ] && break
            sleep .5
          done
          test -n "$window"
          xdotool windowsize "$window" 1560 918
          xdotool windowmove "$window" 0 0
          xdotool windowactivate --sync "$window" || true
          sleep 1
          xdotool mousemove --sync 1120 725 click 1
          sleep 2
          test -s "$ROOT/settings.json"
          xdotool mousemove --sync 1125 743 click 1
          sleep 1
          xdotool mousemove --sync 1125 743 click 1
          sleep 1
          xdotool mousemove --sync 1125 743 click 1
          sleep 2
          xdotool mousemove --sync 45 344 click 1
          sleep 2
          import -window root "$evidence/01-wiki-home.png"
          xdotool mousemove --sync 305 166 click 1
          sleep 2
          import -window root "$evidence/02-getting-started.png"
          echo D42_WIKI_LIVE_GUI_ENTERED
          SCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-d42-real-wiki-navigation-evidence
          path: e2e-evidence/
          if-no-files-found: ignore
          retention-days: 1
