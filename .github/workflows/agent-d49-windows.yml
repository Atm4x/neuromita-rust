name: Agent D50 Windows registry native validation
on:
  push:
    branches:
      - bridge/agent-d49-windows-native-20261109
permissions:
  contents: read
jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Windows registry recovery guard tests
        run: cargo test --locked --offline --lib updater:: -- --test-threads=2
      - name: Test real Windows recovery helper
        run: cargo test --locked --offline --test updater_offline_recovery
      - name: Check native GUI
        run: cargo check --locked --offline --features gui --bin neuromita-gui
      - name: Rust formatting
        run: cargo fmt --all -- --check
