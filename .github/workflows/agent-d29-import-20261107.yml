name: Agent D29 verified incremental import
on:
  push:
    branches:
      - codex/bridge-agent-d29-import-20261107
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact local commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=860284de8b65c35cb84fb70cd58e35a1246a00ed
          HEAD=ace68913a8c2bfdd5378e8755042d3672c1dc823
          TREE=b78da2f9049ad0969159d1c7ce82da63c97a7706
          BRANCH=codex/python-settings-lock-race-20261107
          git fetch --no-tags origin refs/heads/codex/python-settings-atomic-composite-import-20261107
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          test "$(git ls-remote --heads origin "refs/heads/$BRANCH" | wc -l)" -eq 0
          base64 --decode .git-bridge/d29-incremental.bundle.b64 > /tmp/agent-d29.bundle
          echo "3584b060b0ac9ca9b4dcaf2368c851a5ab541494826eea917bea4cf946881a7b  /tmp/agent-d29.bundle" | sha256sum --check
          git bundle verify /tmp/agent-d29.bundle
          git fetch /tmp/agent-d29.bundle "refs/heads/$BRANCH:refs/heads/$BRANCH"
          test "$(git rev-parse "refs/heads/$BRANCH")" = "$HEAD"
          test "$(git rev-parse "$HEAD^{tree}")" = "$TREE"
          test "$(git rev-parse "$HEAD^")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" -eq 1
          git fsck --full
          git push origin "$HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD"
