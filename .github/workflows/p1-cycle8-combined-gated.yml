name: P1 Cycle8 combined PR433 PR434 plus example gate acceptance
on:
  push:
    branches: [bridge/p1-cycle8-combined-gated-qa-20261112]
permissions:
  contents: read
jobs:
  combined-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout combined product HEAD
        uses: actions/checkout@v4
        with:
          ref: 2d4e798a15b1e768df17b5d1ddfdb28f71a1bed1
          persist-credentials: false
      - name: Exact source pin
        run: test "$(git rev-parse HEAD)" = "2d4e798a15b1e768df17b5d1ddfdb28f71a1bed1"
      - name: Native Slint and X11 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev xvfb xauth
      - name: Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Fmt full tree
        run: cargo +1.98.1 fmt --all -- --check
      - name: Offline all target check
        run: cargo +1.98.1 check --locked --offline --all-targets
      - name: Full lib tests
        run: cargo +1.98.1 test --locked --offline --lib -- --test-threads=2
      - name: Accepted rejected accepted DSL vertical slice
        run: cargo +1.98.1 test --locked --offline --test vertical_slice prompt_nonlocal_set_is_persisted_only_after_accepted_reply -- --test-threads=2
      - name: Stream retry preset catalog tests
        run: cargo +1.98.1 test --locked --offline --lib generation::presets::tests -- --test-threads=2
      - name: Offline GUI all target compile
        run: cargo +1.98.1 check --locked --offline --features gui --all-targets
      - name: Executable GUI binding tests on Xvfb
        run: xvfb-run -a cargo +1.98.1 test --locked --offline --features gui --bin neuromita-gui -- --test-threads=1
