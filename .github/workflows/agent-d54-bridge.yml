name: Agent D54 exact guarded-handoff source import
on:
  push:
    branches:
      - bridge/agent-d54-failclosed-handoff-20261109
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate original D54 Git commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=601f3f7c011dda450f2e2292b934a3dbdcd9a970
          EXPECTED=8b91fb8b36c7755714cc0aa6975e09e2fa5f8850
          TREE=9f00ecb26850497c247929b9383d462076ccd04d
          cat .agent-bridge/d54-part-0{1,2,3,4,5}.b64 | tr -d '\n' | base64 -d >/tmp/d54.patch.br
          echo '5b01d62ac5d70a2547df941a9cedb13c0653bf3db568b8365d38d8ebde9acf1c  /tmp/d54.patch.br' | sha256sum -c
          node -e "const fs=require('node:fs');const z=require('node:zlib');fs.writeFileSync('/tmp/d54.patch',z.brotliDecompressSync(fs.readFileSync('/tmp/d54.patch.br')))"
          echo 'a0e3aab831bfc21891352754411be981a98e2d06aac9a0e7838e233df7226da8  /tmp/d54.patch' | sha256sum -c
          git fetch origin "$BASE"
          git checkout --detach "$BASE"
          git -c user.name='Agent D' -c user.email='agent-d@local.invalid' am --committer-date-is-author-date /tmp/d54.patch
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          git diff --check HEAD^ HEAD
          git fsck --full
          git push origin HEAD:refs/heads/codex/agent-d54-failclosed-handoff-20261109
