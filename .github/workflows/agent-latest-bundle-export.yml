name: Export pinned Agent C PR404 source delta
on:
  push:
    branches:
      - bridge/agent-latest-source-export-20261106
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai-native-signed-release-catalog-20261110
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact delta from PR344
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "fa6b0ba1c72b26ce79e5f39be65936fec6d78bfb"
          TARGET="refs/heads/codex/ai-native-signed-release-catalog-20261110"
          git update-ref "$TARGET" "$HEAD"
          git merge-base --is-ancestor "7e12464181355c79179afd61f26d2d1839a6508e" "$HEAD"
          git bundle create agent-c-pr404-delta.bundle "$TARGET" "^7e12464181355c79179afd61f26d2d1839a6508e"
          git bundle verify agent-c-pr404-delta.bundle
          sha256sum agent-c-pr404-delta.bundle > agent-c-pr404-delta.bundle.sha256
          printf 'repository=Atm4x/neuromita-rust\nbranch=codex/ai-native-signed-release-catalog-20261110\nhead=%s\nbase=7e12464181355c79179afd61f26d2d1839a6508e\n' "$HEAD" > agent-c-pr404.manifest
      - uses: actions/upload-artifact@v4
        with:
          name: agent-c-pr404-source
          path: |
            agent-c-pr404-delta.bundle
            agent-c-pr404-delta.bundle.sha256
            agent-c-pr404.manifest
          retention-days: 3
          if-no-files-found: error
