name: Export pinned Agent C PR377 delta
on:
  push:
    branches:
      - bridge/agent-latest-source-export-20261106
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai-native-workflow-hub-20261109
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact delta
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "260249daa6679d78644301c9a80bfebd1a2376dc"
          TARGET="refs/heads/codex/ai-native-workflow-hub-20261109"
          git update-ref "$TARGET" "$HEAD"
          git merge-base --is-ancestor "7076ddcadd1ac93d1121c531b26c1494c06356ae" "$HEAD"
          git bundle create neuromita-rust-latest.bundle "$TARGET" "^7076ddcadd1ac93d1121c531b26c1494c06356ae"
          git bundle verify neuromita-rust-latest.bundle
          sha256sum neuromita-rust-latest.bundle > neuromita-rust-latest.bundle.sha256
          printf 'repository=Atm4x/neuromita-rust\nbranch=codex/ai-native-workflow-hub-20261109\nhead=%s\nbase=7076ddcadd1ac93d1121c531b26c1494c06356ae\n' "$HEAD" > neuromita-rust-latest.manifest
      - uses: actions/upload-artifact@v4
        with:
          name: neuromita-rust-latest-source
          path: |
            neuromita-rust-latest.bundle
            neuromita-rust-latest.bundle.sha256
            neuromita-rust-latest.manifest
          retention-days: 3
          if-no-files-found: error
