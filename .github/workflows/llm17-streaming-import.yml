name: Import LLM17 Streaming Git Bundle
on:
  push:
    branches:
      - bridge/llm17-streaming-import-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bundle and publish exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=e38ee3975cee12d2a3b06535df1f2537fdef05ad
          HEAD=a46f61c2cca13e216a413ad173f5bc7c328150b4
          TARGET=refs/heads/codex/llm-streaming-retry-20261106
          base64 --decode bridge_payloads/llm17-streaming.bundle.b64 > /tmp/llm17.bundle
          echo '80f8cef23701dcb6efdb5daf0ec8cf1f065017102e790c29f9e8d2733ece9a15  /tmp/llm17.bundle' | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/llm17.bundle
          git fetch /tmp/llm17.bundle "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git diff --check "$BASE" "$HEAD"
          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git push origin "$HEAD:$TARGET"
