name: Import Agent B28 verified Git bundle
on:
  push:
    branches:
      - bridge/agent-b28-return-20261107
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6691355751178a71f140c4a9f68eb89e7ddd91fc
          fetch-depth: 0
      - name: Verify and publish B28 fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=6691355751178a71f140c4a9f68eb89e7ddd91fc
          EXPECTED=4e533ffbe39bfc3f57a051167a41116e5d2f75b5
          SHA256=29d19e806df1934a2e6656a2fd66f4c7e0ad37255a9c071314bfe053339f8ca6
          TARGET=refs/heads/codex/timeline-python-canonical-drafts-20261107
          git fetch origin refs/heads/bridge/agent-b28-return-20261107
          git show FETCH_HEAD:.bridge/agent-b28-20261107.bundle.b64 | base64 --decode > /tmp/b28.bundle
          echo "$SHA256  /tmp/b28.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/b28.bundle
          git fetch /tmp/b28.bundle HEAD
          IMPORTED="$(git rev-parse FETCH_HEAD)"
          test "$IMPORTED" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" "$IMPORTED"
          REMOTE="$(git ls-remote origin "$TARGET" | cut -f1)"
          if [[ -n "$REMOTE" && "$REMOTE" != "$EXPECTED" ]]; then
            echo "Unexpected existing destination ref: $REMOTE" >&2
            exit 1
          fi
          git update-ref "$TARGET" "$IMPORTED"
          if [[ "$REMOTE" != "$EXPECTED" ]]; then
            git push origin "$TARGET:$TARGET"
          fi
          echo "Published $TARGET at $IMPORTED"
