name: Agent D18 Python 3.12 full lib verification
on:
  push:
    branches:
      - bridge/agent-d18-python312-tests-20261107
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/onboarding-guide-build-repair-20261107
          persist-credentials: false
      - name: Validate exact D18 source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "377a54a167c2b1d200164dc8ddf08513bbce1d9b"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev
      - name: Install Rust 1.98.1
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify toolchains
        shell: bash
        run: |
          rustc +1.98.1 --version
          python --version
          python3.12 --version
      - name: Run all library tests without skips
        shell: bash
        env:
          NEUROMITA_TEST_PYTHON: ${{ env.pythonLocation }}/bin/python3.12
        run: |
          set -euxo pipefail
          cargo +1.98.1 test --locked --offline --lib -- --nocapture
