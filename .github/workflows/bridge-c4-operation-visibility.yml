name: Bridge C4 installation operation visibility exact commit
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-operation-visibility.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Import and verify exact C4 Git commit
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-operation.bundle
          test "$(sha256sum /tmp/c4-operation.bundle | cut -d' ' -f1)" = '34be5ae57adb4bcbcb8b867911e177012f59c4665436e4fa67b9c3a90a35ea75'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-verified-remote-overlay-install-20261108
          test "$(git rev-parse FETCH_HEAD)" = 'a2513556ce3ac55379b81ddf16269a5cd28a5160'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-operation-status-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = 'a2513556ce3ac55379b81ddf16269a5cd28a5160'
          git bundle verify /tmp/c4-operation.bundle
          git fetch /tmp/c4-operation.bundle refs/heads/codex/ai-platform-hub-c4-operation-status-20261108
          test "$(git rev-parse FETCH_HEAD)" = '6641714dbf486d8449f1cd63c025c54760e825bf'
          git checkout --detach '6641714dbf486d8449f1cd63c025c54760e825bf'
          test "$(git rev-parse 'HEAD^{tree}')" = '51ea714572a0c313b7f1c00ea15bf630f32724f2'
          git merge-base --is-ancestor 'a2513556ce3ac55379b81ddf16269a5cd28a5160' HEAD
          git diff --check 'a2513556ce3ac55379b81ddf16269a5cd28a5160' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-operation-status-20261108
