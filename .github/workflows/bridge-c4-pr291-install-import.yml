name: Bridge C4 real install plan review patch
on:
  push:
    branches: [bridge/c4-pr291-source-20261108]
    paths: [.github/workflows/bridge-c4-pr291-install-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-pr291-source-20261108
          fetch-depth: 0
      - name: Import exact patch with source fingerprint and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-install-review.patch
          test "$(sha256sum /tmp/c4-install-review.patch | cut -d' ' -f1)" = 'c6f62b4b9bcbbed7ba0caf7d943ab8bf3f4e7b3fd6675620322aeeaee4dca6fe'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-selection-fence-install-review-20261108
          test "$(git rev-parse FETCH_HEAD)" = '372568445b9282993e5deb6026df0a055f13fd95'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-install-plan-preview-20261108:refs/remotes/origin/c4-install-candidate
          test "$(git rev-parse refs/remotes/origin/c4-install-candidate)" = '372568445b9282993e5deb6026df0a055f13fd95'
          git checkout --detach '372568445b9282993e5deb6026df0a055f13fd95'
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git am --committer-date-is-author-date /tmp/c4-install-review.patch
          test "$(git rev-parse HEAD)" = 'f4d14f1e6da4527a5aa17a2a227f801ff7484f41'
          test "$(git rev-parse 'HEAD^{tree}')" = 'b5d5fa45a6c764be616bd00c9b74f212c615a93b'
          git merge-base --is-ancestor '372568445b9282993e5deb6026df0a055f13fd95' HEAD
          git diff --check '372568445b9282993e5deb6026df0a055f13fd95' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-install-plan-preview-20261108
