name: Import Issue53 Phase3 Bundle
on:
  push:
    branches:
      - bridge/issue53-phase3-import-20261105
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish exact Git objects
        shell: bash
        run: |
          set -euo pipefail
          BASE=2b2cf32d61a0ef02be193c73e8962be07825fa97
          HEAD=091f4acf95aa898b886afa1f0b97bf24f7b32eaf
          TARGET=refs/heads/codex/gamelink-issue53-20261105
          base64 --decode bridge_payloads/issue53-phase3.bundle.b64 > /tmp/issue53.bundle
          echo '85576a0e7d49b2822e62ff66a9b88d8317919e21b0a18db45cff2a55f7bb84e8  /tmp/issue53.bundle' | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify /tmp/issue53.bundle
          git fetch /tmp/issue53.bundle "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git push origin "$HEAD:$TARGET"
