name: Agent D38 real Slint headless screenshot smoke (system runtime repaired)
on:
  push:
    branches:
      - codex/bridge-agent-d38-screenshots-v2-20261108
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/onboarding-guide-durable-navigation-20261108
          fetch-depth: 0
      - name: Assert product D38 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7541a84c36af4f9c947e7da3c57e985ea7a13d16
          test "$(git rev-parse HEAD^{tree})" = f73f19320eb4a7bf8ab65c7eba33c104b01066ed
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Build Slint GUI snapshot with all X11 runtime libraries
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev lld
          cargo build --locked --offline --features gui --example gui_snapshot -j 2
      - name: Render RU/EN EULA and Full Guide on real Slint surface
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SLINT_BACKEND: 'winit-femtovg'
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for mode in onboarding-eula-ru onboarding-eula-en onboarding-guide-ru onboarding-guide-en; do
            xvfb-run -a -s "-screen 0 1920x1200x24" ./target/debug/examples/gui_snapshot "screenshots/$mode.ppm" "$mode"
          done
          python3 - <<'PY'
          from pathlib import Path
          for f in sorted(Path('screenshots').glob('*.ppm')):
              b=f.read_bytes()
              assert b.startswith(b'P6\n1560 918\n255\n'), (f,b[:40])
              assert len(b)>4_000_000,(f,len(b))
              print(f.name,len(b))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-d38-real-slint-eula-guide-frames
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 1
