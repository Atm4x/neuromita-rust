name: agent-a-cycle38-outgoing-import
on:
  push:
    branches: [bridge/agent-a-cycle36-bundle-export]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import original Cycle38 commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .gitbridge/agent-a-cycle38-outgoing.b64 ]]; then
            echo "Waiting for payload"
            exit 0
          fi
          git fetch origin 558876b18df4bcb6a4c23efaf4105aab23f17b9b
          base64 --decode .gitbridge/agent-a-cycle38-outgoing.b64 > /tmp/cycle38.bundle
          echo "ad75f46fae0527f54fcc49fdd9742197cfa2739ad33a2b62951d380b0444e4c0  /tmp/cycle38.bundle" | sha256sum -c -
          git bundle verify /tmp/cycle38.bundle
          git fetch /tmp/cycle38.bundle HEAD:refs/heads/bridge/agent-a-cycle38-candidate
          test "$(git rev-parse refs/heads/bridge/agent-a-cycle38-candidate)" = "a8e2ce7f9cbd71044f15522460f550e95a97b063"
          git merge-base --is-ancestor 558876b18df4bcb6a4c23efaf4105aab23f17b9b refs/heads/bridge/agent-a-cycle38-candidate
          test "$(git rev-parse refs/heads/bridge/agent-a-cycle38-candidate^{tree})" = "28ec91fb8cb739b646793509f0c7abaf151bed32"
          git push origin refs/heads/bridge/agent-a-cycle38-candidate:refs/heads/bridge/agent-a-cycle38-candidate
