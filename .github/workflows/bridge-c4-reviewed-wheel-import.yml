name: Bridge C4 reviewed wheel admission exact Git import
on:
  push:
    branches: [bridge/c4-reviewed-wheel-admission-20261108]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-reviewed-wheel-admission-20261108
          fetch-depth: 0
      - name: Verify pinned one-commit incremental bundle and fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | xz -d > /tmp/c4-reviewed-wheel.bundle
          test "$(sha256sum /tmp/c4-reviewed-wheel.bundle | cut -d' ' -f1)" = 'c2e4509b8b60537e3e031915900d949806ad16a15bf456e791d5d0e261f8a3a4'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-declarative-build-stages-20261108
          test "$(git rev-parse FETCH_HEAD)" = '9a4a62f6a750d62b03dae83b57d1273f28b33828'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-reviewed-wheel-admission-20261108:refs/remotes/origin/c4-candidate
          test "$(git rev-parse refs/remotes/origin/c4-candidate)" = '9a4a62f6a750d62b03dae83b57d1273f28b33828'
          git bundle verify /tmp/c4-reviewed-wheel.bundle
          git fetch /tmp/c4-reviewed-wheel.bundle refs/heads/work
          test "$(git rev-parse FETCH_HEAD)" = '265caea0b83489c26a12a2341d104110dda84342'
          git checkout --detach '265caea0b83489c26a12a2341d104110dda84342'
          test "$(git rev-parse 'HEAD^{tree}')" = 'c65549b35c6033d38fd267ebdefe7ee09259c44c'
          git merge-base --is-ancestor '9a4a62f6a750d62b03dae83b57d1273f28b33828' HEAD
          git diff --check '9a4a62f6a750d62b03dae83b57d1273f28b33828' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-reviewed-wheel-admission-20261108
