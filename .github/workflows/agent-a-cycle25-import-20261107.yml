name: Agent A cycle25 verified Graph Provenance and Acceptance Matrix import
on:
  push:
    branches:
      - bridge/import-agent-a-cycle25-20261107
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original Git graph provenance commit and fast-forward scoped branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB: 3bd6995a4306c8d8768faaa001dd8059e6aa6208
          BUNDLE_SHA256: 2ad231cf061e0d1efe35d3aea17addbf8ecb077e16a2329872e4ce68776e43ea
          START_SHA: f4cc5059a185fb8700a0f3daae829d24503672ec
          HEAD_SHA: 98ab26c686add7411fc92dc532671eefb03c3d8c
          FEATURE_REF: codex/knowledge-graph-provenance-inspection-20261107
          BASE_REF: codex/knowledge-graph-production-20261107
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$SOURCE_BLOB" \
            | jq -r '.content' | base64 --decode > agent-a-cycle25-return.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" agent-a-cycle25-return.bundle | sha256sum -c -
          test "$(stat -c%s agent-a-cycle25-return.bundle)" = 8440
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          test "$(git rev-parse "refs/remotes/origin/$BASE_REF")" = "$START_SHA"
          git bundle verify agent-a-cycle25-return.bundle
          git fetch ./agent-a-cycle25-return.bundle "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          test "$(git rev-parse "refs/heads/$FEATURE_REF")" = "$HEAD_SHA"
          git merge-base --is-ancestor "$START_SHA" "$HEAD_SHA"
          git fsck --full
          git push origin "refs/heads/$FEATURE_REF:refs/heads/$FEATURE_REF"
          git fetch origin "+refs/heads/$FEATURE_REF:refs/remotes/origin/$FEATURE_REF"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_REF")" = "$HEAD_SHA"
          echo "PUBLISHED ORIGINAL HEAD $HEAD_SHA"
