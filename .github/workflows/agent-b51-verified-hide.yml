name: Agent B51 verified per-message hide and executable Slint
on:
  push:
    branches: [bridge/agent-b51-hide-message-20261108]
    paths: [bridge/agent-b51.patch.gz.b64]
permissions:
  contents: write
jobs:
  publish-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact B51 source tree and publish linearly
        shell: bash
        run: |
          set -euo pipefail
          base=ca7fefff1bd20930874c51986b3488df93ef1780
          tree=570f88bc34d579e08c2cf9468665253261ad3211
          branch=codex/timeline-b51-single-message-hide-20261108
          base64 -d bridge/agent-b51.patch.gz.b64 > /tmp/agent-b51.patch.gz
          echo "0d680ab40b97f82a7513849a7b869df4e5e6ec651c656920e93f44312c8d4ec7  /tmp/agent-b51.patch.gz" | sha256sum -c -
          gzip -t /tmp/agent-b51.patch.gz
          gzip -dc /tmp/agent-b51.patch.gz > /tmp/agent-b51.patch
          git switch --detach "$base"
          test "$(git rev-parse HEAD)" = "$base"
          git apply --check /tmp/agent-b51.patch
          git apply --index /tmp/agent-b51.patch
          test "$(git write-tree)" = "$tree"
          git -c user.name="Agent B" -c user.email="agent-b@neuro-mita.local" commit -m "feat(chat): hide one visible canonical message with anchored confirmation"
          git merge-base --is-ancestor "$base" HEAD
          git ls-remote --exit-code origin "refs/heads/$branch" && { echo "B51 branch already exists"; exit 1; } || test "$?" = 2
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "B51_HEAD=$(git rev-parse HEAD)"
          echo "B51_TREE=$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libudev-dev libxkbcommon-dev libx11-dev
      - name: Run precise Timeline per-message hide regression
        run: |
          set -euo pipefail
          cargo test --locked --offline --test vertical_slice conversation_single_message_hide_checks_event_identity_observer_and_timeline_anchor -- --test-threads=1
      - name: Run actual headless Slint per-message callback regression
        run: |
          set -euo pipefail
          cargo test --locked --offline --features gui --bin neuromita-gui chat_single_message_hide_callback_uses_event_id_and_origin_revision -- --test-threads=1
      - name: Verify source format
        run: cargo fmt --all -- --check
