name: Bridge C4 catalog read-only presenter
on:
  push:
    branches: [bridge/c4-single-ref-source-20261108]
    paths: [.github/workflows/bridge-c4-catalog-presenter.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge/c4-single-ref-source-20261108
          fetch-depth: 0
      - name: Verify incremental exact Git objects and candidate fast-forward
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/c4-inventory.bundle
          test "$(sha256sum /tmp/c4-inventory.bundle | cut -d' ' -f1)" = '8c6606c35d4708396a0031d9459d32800099bdc5e56c6cc69a51973ad4d8adbc'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-compact-toolbar-tabs-20261108
          test "$(git rev-parse FETCH_HEAD)" = 'ad9334cd0655ceccefd873b3165f9dc5b62e1c89'
          git fetch origin refs/heads/codex/ai-platform-hub-c4-readonly-inventory-presenter-20261108:refs/remotes/origin/c4-presenter-candidate
          test "$(git rev-parse refs/remotes/origin/c4-presenter-candidate)" = 'ad9334cd0655ceccefd873b3165f9dc5b62e1c89'
          git bundle verify /tmp/c4-inventory.bundle
          git fetch /tmp/c4-inventory.bundle refs/heads/codex/ai-platform-hub-c4-inventory-presenter-badge-20261108
          test "$(git rev-parse FETCH_HEAD)" = '7df9417eb5bec363dc984dd62c4014c9c238be3f'
          git checkout --detach '7df9417eb5bec363dc984dd62c4014c9c238be3f'
          test "$(git rev-parse 'HEAD^{tree}')" = 'b5885af20b4c7ccee5b1721e57631d37d7302bd4'
          git merge-base --is-ancestor 'ad9334cd0655ceccefd873b3165f9dc5b62e1c89' HEAD
          git diff --check 'ad9334cd0655ceccefd873b3165f9dc5b62e1c89' HEAD
          git push origin HEAD:refs/heads/codex/ai-platform-hub-c4-readonly-inventory-presenter-20261108
