name: Agent A Cycle70 exact Git bundle importer
on:
  push:
    branches:
      - bridge/agent-a-cycle70-import-20261110
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish original local Git commit
        shell: bash
        env:
          BASE: 908f1aac5cf2a5db1bf8b6c4cf16535610d479ce
          ORIGINAL: 25cd0a13a15d6cb37ebf526730282b2bfc4cd024
          TREE: 7d06d540adea92d048d62bd7641bc8d0ab41f2f2
          SHA256: b4a8cd61128efef58e4eb550f01c72cf2cd7debfb2e8d78d5f1cd50aeff0ad02
          DEST: codex/knowledge-r6-versioned-corpus-fork-20261110
        run: |
          set -euo pipefail
          base64 --decode bridge-data/cycle70.bundle.b64 > cycle70.bundle
          test "$(wc -c < cycle70.bundle)" = 8960
          echo "$SHA256  cycle70.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify cycle70.bundle
          git fetch cycle70.bundle refs/heads/agent-a-cycle70-publish:refs/heads/cycle70-candidate
          test "$(git rev-parse refs/heads/cycle70-candidate)" = "$ORIGINAL"
          test "$(git rev-parse "$ORIGINAL^{tree}")" = "$TREE"
          test "$(git show -s --format=%P "$ORIGINAL")" = "$BASE"
          git merge-base --is-ancestor "$BASE" "$ORIGINAL"
          git fsck --full
          test -z "$(git ls-remote --heads origin "refs/heads/$DEST")"
          git push origin "$ORIGINAL:refs/heads/$DEST"
          printf '%s\n' "head=$ORIGINAL" "parent=$BASE" "tree=$TREE" "bundle_sha256=$SHA256" > cycle70-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-a-cycle70-import-receipt
          path: cycle70-verified.txt
          retention-days: 1
