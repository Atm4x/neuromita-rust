name: P1 in-flight character-switch acceptance
on:
  push:
    branches: [bridge/p1-character-switch-qa-20261111]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b60517cc2bc293ed77b6d5330b251972749dc37
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Fmt
        run: cargo +1.98.1 fmt --all -- --check
      - name: In-flight profile switch and cancellation scenario
        run: cargo +1.98.1 test --locked --offline --test vertical_slice profile_change_during_generation_preserves_request_character_and_next_preset -- --nocapture
