name: Agent A Cycle58 verified Git bundle import
on:
  push:
    branches:
      - bridge/agent-a-cycle58-import-20261109
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish original local commit
        shell: bash
        env:
          BASE: 665e34e0c1079f6ebd2ffbc897efb5a3db51a40b
          ORIGINAL: dbe9ce81479872ec0d7a31f398550778efa56684
          TREE: 60a667f8c99125f94bf7d7b38fea4aec97883ce9
          SHA256: d7dd600d2ec6ddf805c543e7051807b3a69e967ea1fbfab8afe5de5c9e8836cb
          DEST: codex/knowledge-d5-recovery-known-files-restore-20261109
        run: |
          set -euo pipefail
          base64 --decode bridge-data/cycle58.bundle.b64 > cycle58-outgoing.bundle
          echo "$SHA256  cycle58-outgoing.bundle" | sha256sum --check
          git cat-file -e "$BASE^{commit}"
          git bundle verify cycle58-outgoing.bundle
          git fetch cycle58-outgoing.bundle refs/heads/agent-a-cycle58-work:refs/heads/cycle58-candidate
          test "$(git rev-parse refs/heads/cycle58-candidate)" = "$ORIGINAL"
          test "$(git rev-parse "$ORIGINAL^{tree}")" = "$TREE"
          test "$(git show -s --format=%P "$ORIGINAL")" = "$BASE"
          git merge-base --is-ancestor "$BASE" "$ORIGINAL"
          git fsck --full
          test -z "$(git ls-remote --heads origin "refs/heads/$DEST")"
          git push origin "$ORIGINAL:refs/heads/$DEST"
          echo "original_head=$ORIGINAL" > cycle58-verified.txt
          echo "original_parent=$BASE" >> cycle58-verified.txt
          echo "original_tree=$TREE" >> cycle58-verified.txt
          echo "bundle_sha256=$SHA256" >> cycle58-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-a-cycle58-import-receipt
          path: cycle58-verified.txt
          retention-days: 1
