name: Git Bridge - export main bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/git-bridge-export.yml

permissions:
  contents: read

jobs:
  export-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout -B main refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse HEAD)"

          git bundle create repository.bundle refs/heads/main
          git bundle verify repository.bundle
          sha256sum repository.bundle > repository.bundle.sha256

          printf 'repository=%s\nref=refs/heads/main\nsha=%s\n' "${GITHUB_REPOSITORY}" "${MAIN_SHA}" > repository.bundle.manifest
          git bundle list-heads repository.bundle >> repository.bundle.manifest

          git clone --quiet --branch main repository.bundle "${RUNNER_TEMP}/bridge-clone"
          test "$(git -C "${RUNNER_TEMP}/bridge-clone" rev-parse HEAD)" = "${MAIN_SHA}"
          git -C "${RUNNER_TEMP}/bridge-clone" fsck --full
          du -h repository.bundle

      - name: Upload verified Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: git-bridge-main-${{ github.run_id }}
          path: |
            repository.bundle
            repository.bundle.sha256
            repository.bundle.manifest
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
