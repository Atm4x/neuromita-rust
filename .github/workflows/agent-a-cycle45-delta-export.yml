name: agent-a-cycle45-delta-export
on:
  push:
    branches: [bridge/agent-a-cycle45-delta-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export incremental Git objects from PR276 through exact PR304
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin f55e96cea5db2976308612e598b0841b2622e9f8
          git fetch origin 43894a8e766815605232cb0f763b2ee1d5dfda0a:refs/heads/agent-a-pr304
          test "$(git rev-parse agent-a-pr304)" = "43894a8e766815605232cb0f763b2ee1d5dfda0a"
          git merge-base --is-ancestor f55e96cea5db2976308612e598b0841b2622e9f8 agent-a-pr304
          git bundle create cycle45-PR276-to-PR304.bundle refs/heads/agent-a-pr304 ^f55e96cea5db2976308612e598b0841b2622e9f8
          git bundle verify cycle45-PR276-to-PR304.bundle
          sha256sum cycle45-PR276-to-PR304.bundle > cycle45-PR276-to-PR304.bundle.sha256
          git log -1 --format='%H %P %T' agent-a-pr304
      - uses: actions/upload-artifact@v4
        with:
          name: agent-a-cycle45-source-delta
          path: |
            cycle45-PR276-to-PR304.bundle
            cycle45-PR276-to-PR304.bundle.sha256
          retention-days: 2
