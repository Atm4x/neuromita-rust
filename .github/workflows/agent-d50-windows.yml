name: Agent D50 Windows registry recovery acceptance
on:
  push:
    branches:
      - bridge/agent-d50-windows-ci-20261109
permissions:
  contents: read
jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agent-d50-windows-reboot-guard-20261109
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Test Windows registry startup guard and updater lifecycle
        run: cargo test --locked --offline --lib updater:: -- --test-threads=2
      - name: Test real native Windows offline recovery helper
        run: cargo test --locked --offline --test updater_offline_recovery
      - name: Check native GUI
        run: cargo check --locked --offline --features gui --bin neuromita-gui
      - name: Check all targets
        run: cargo check --locked --offline --all-targets
      - name: Rust formatting
        run: cargo fmt --all -- --check
